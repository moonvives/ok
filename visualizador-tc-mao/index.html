const LOOSE_FOLDER={video:"videos",pdf:"documentos",image:"imagens",dicom:"dicom_sem_imagem",other:"outros"};
function looseLabel(f){ return f.kind==="video"?"Vídeo original":f.kind==="pdf"?"Documento (PDF)":f.kind==="dicom"?"DICOM sem imagem (DICOMDIR / estruturado)":f.kind==="image"?"Imagem original":"Arquivo original"; }

function safeName(s){ return String(s||"").replace(/[^\w.\-áéíóúâêôãõçÁÉÍÓÚÂÊÔÃÕÇ ]+/g,"_").replace(/\s+/g,"_").slice(0,80)||"item"; }

function buildManifest(fileSubset){
  const list=fileSubset||APP.files;
  return {
    arquivo:"Tomografia computadorizada — exportação",
    gerado_em:new Date().toISOString(),
    observacao:"Bytes originais preservados sem modificação. Hashes SHA-256 para verificação de integridade.",
    total_arquivos:list.length,
    total_bytes:list.reduce((a,f)=>a+(f.size||0),0),
    estudos:APP.studies.map(st=>({
      descricao:st.desc, data:st.date, uid:st.uid,
      series:st.series.map(s=>({
        descricao:s.desc, numero:s.number, modalidade:s.modality, uid:s.uid,
        volume_3d:!!s.isVolume, imagens:s.instances.length,
        instancias:s.instances.filter(f=>list.includes(f)).map(f=>({
          arquivo:f.name, tipo:f.kind, tamanho:f.size, sha256:f.hash,
          comprimido:f.meta?f.meta.compressed:false,
          dimensoes:f.meta?((f.meta.cols||"")+"x"+(f.meta.rows||"")):null,
          instancia:f.meta?f.meta.instanceNumber:null,
        })),
      })),
    })),
    outros_arquivos: looseFiles().filter(f=>list.includes(f)).map(f=>({
      arquivo:f.name, caminho_original:f.path, tipo:f.kind, descricao:looseLabel(f), tamanho:f.size, sha256:f.hash,
    })),
  };
}

async function exportEntries(fileSubset, zipName){
  toast("Gerando backup… isso pode levar alguns segundos.","",6000);
  const list=fileSubset||APP.files;
  const entries=[]; const checks=[]; const missing=[]; const used=new Set();
  // evita sobrescrever dois arquivos de mesmo nome na mesma pasta do .zip
  function uniquePath(p){ if(!used.has(p)){used.add(p);return p;} const dot=p.lastIndexOf("."); let i=2,q;
    do{ q=dot>p.lastIndexOf("/")?(p.slice(0,dot)+"_"+i+p.slice(dot)):(p+"_"+i); i++; }while(used.has(q)); used.add(q); return q; }
  async function add(f,folder){
    const buf=await getBuf(f.id); if(!buf){ missing.push(f.name); return; }
    const path=uniquePath("ARQUIVO_TC/"+folder+"/"+f.name);
    entries.push({name:path,bytes:new Uint8Array(buf)});
    checks.push(f.hash+"  "+path);
  }
  for(const st of APP.studies){
    for(const s of st.series){
      for(const f of s.instances){
        if(!list.includes(f)) continue;
        await add(f, safeName(st.uid==="MIDIA-IMPORTADA"?"midia":(st.desc||"estudo"))+"/"+safeName(s.desc||("serie_"+s.number)));
      }
    }
  }
  // vídeos, PDFs, DICOMDIR e demais arquivos: também vão para o backup
  for(const f of looseFiles()){ if(list.includes(f)) await add(f, LOOSE_FOLDER[f.kind]||"outros"); }
  if(missing.length) toast("Atenção: "+missing.length+" arquivo(s) sem dados locais não entraram no backup: "+missing.map(esc).join(", "),"err",9000);
  const enc=new TextEncoder();
  entries.push({name:"ARQUIVO_TC/manifest.json",bytes:enc.encode(JSON.stringify(buildManifest(list),null,2))});
  entries.push({name:"ARQUIVO_TC/integridade/checksums.sha256",bytes:enc.encode(checks.join("\n")+"\n")});
  entries.push({name:"ARQUIVO_TC/LEIA-ME.txt",bytes:enc.encode(
    "TOMOGRAFIA COMPUTADORIZADA - ARQUIVOS DO EXAME\n\n"+
    "Conteudo: arquivos originais do exame, manifest.json e integridade/checksums.sha256 (SHA-256).\n\n"+
    "Para abrir: abra o index.html no navegador, clique em Importar e selecione este .zip ou a pasta.\n\n"+
    "Gerado em "+new Date().toLocaleString("pt-BR")+"\n"
  )});
  let blob;
  try{ blob=buildZipBlob(entries); }
  catch(e){ toast(esc(e.message),"err",9000); return; }
  downloadBytes((zipName||("ARQUIVO_TC_"+nowStamp()))+".zip", blob);
  toast("Backup gerado ("+fmtBytes(blob.size)+", "+(entries.length-3)+" arquivo(s) original(is)).","ok",5000);
}

/* =====================================================================
   SITE COMPLETO EM ARQUIVO ÚNICO
   Gera um .html com o visualizador e todos os arquivos do exame embutidos
   (base64, um bloco por arquivo). Ao abrir, o exame é carregado sozinho.
   Obs.: as tags de script são escritas como "<\/script>" para não encerrar

let APP_SOURCE="";
const EMBED={files:[],bundle:null};

// chamado no início do boot: separa os dados embutidos e guarda o código-fonte limpo do site
function captureEmbedded(){
  for(const n of document.querySelectorAll('script[type="application/x-exam-file"]')){
    EMBED.files.push({name:n.dataset.name||"arquivo",path:n.dataset.path||n.dataset.name||"arquivo",
      type:n.dataset.type||"",size:parseInt(n.dataset.size||"0",10)||0,b64:n.textContent});
    n.remove();
  }
  const b=document.getElementById("exam-bundle");
  if(b){ try{ EMBED.bundle=JSON.parse(b.textContent); }catch(e){} b.remove(); }
  APP_SOURCE="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
}

function bufToB64(buf){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const s=fr.result; res(s.slice(s.indexOf(",")+1)); };
    fr.onerror=()=>rej(fr.error); fr.readAsDataURL(new Blob([buf])); });
}
async function b64ToBuf(b64){
  try{ const r=await fetch("data:application/octet-stream;base64,"+b64); if(r.ok) return await r.arrayBuffer(); }catch(e){}
  const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer;
}

function showLoading(label,frac){
  let o=$("#loadingOverlay");
  if(!o){ o=el("div",{id:"loadingOverlay"},el("div",{class:"lo-box"},el("div",{class:"lo-t",id:"loLabel"}),
      el("div",{class:"progress"},el("div",{class:"bar",id:"loBar"})))); document.body.append(o); }
  $("#loLabel").textContent=label; $("#loBar").style.width=(clamp(frac,0,1)*100).toFixed(1)+"%";
}
function hideLoading(){ const o=$("#loadingOverlay"); if(o) o.remove(); }

// carrega no armazenamento local os arquivos embutidos (uma única vez por arquivo .html)
async function loadEmbedded(){
  if(!EMBED.files.length) return;
  const id=EMBED.bundle&&EMBED.bundle.id;
  const seen=id?await idbGet("meta","bundleId"):null;
  if(!(id && seen===id && APP.files.length)){
    const list=EMBED.files.map(e=>({name:e.name,size:e.size,type:e.type,_path:e.path,arrayBuffer:()=>b64ToBuf(e.b64)}));
    showLoading("Carregando exame…",0);
    await importFiles(list,(d,t)=>showLoading("Carregando exame… "+d+" / "+t,d/t));
    // medições gravadas no arquivo: chaveadas pelo SHA-256 do arquivo de origem
    const meas=(EMBED.bundle&&EMBED.bundle.meas)||{};
    const byHash=new Map(APP.files.map(f=>[f.hash,f.id]));
    for(const k in meas){ const [h,fr]=k.split("#"); const fid=byHash.get(h); if(fid) APP.measurements[fr?fid+"#"+fr:fid]=meas[k]; }
    await persistMeas();
    if(id){ try{ await idbPut("meta",id,"bundleId"); }catch(e){} }
    hideLoading();
  }
  EMBED.files=[]; // libera a memória dos dados em texto
}

function suggestedName(){
  const h=examHeading(); const base=[h.title||"Tomografia",h.m&&h.m.studyDate?h.m.studyDate:""].filter(Boolean).join("_");
  return safeName(base)||"Tomografia";
}

async function exportStandaloneSite(){
  if(!APP.files.length) return;
  const src=APP_SOURCE, cut=src.lastIndexOf("</bo"+"dy>");
  if(cut<0){ toast("Não foi possível gerar o arquivo.","err"); return; }
  const parts=[src.slice(0,cut)];
  const idToHash=new Map(APP.files.map(f=>[f.id,f.hash]));
  const meas={};
  for(const k in APP.measurements){ const [fid,fr]=k.split("#"); const h=idToHash.get(fid);
    if(h&&APP.measurements[k]&&APP.measurements[k].length) meas[fr?h+"#"+fr:h]=APP.measurements[k]; }
  const bundle={id:uid(),created:new Date().toISOString(),files:APP.files.length,meas};
  parts.push('\n<script type="application/json" id="exam-bundle">'+JSON.stringify(bundle).replace(/</g,"\\u003c")+"<\/script>\n");
  let i=0, total=0;
  for(const f of APP.files){
    showLoading("Gerando arquivo… "+(i+1)+" / "+APP.files.length,i/APP.files.length);
    const buf=await getBuf(f.id); i++; if(!buf) continue;
    parts.push('<script type="application/x-exam-file" data-name="'+esc(f.name)+'" data-path="'+esc(f.path||f.name)+
      '" data-type="'+esc(f.type||"")+'" data-size="'+(f.size||buf.byteLength)+'">',await bufToB64(buf),"<\/script>\n");
    total+=buf.byteLength;
  }
  parts.push(src.slice(cut));
  const blob=new Blob(parts,{type:"text/html"});
  hideLoading();
  downloadBytes(suggestedName()+".html",blob);
  toast("Arquivo gerado: "+fmtBytes(blob.size)+".","ok",5000);
}

function setupDropzone(){
  const dz=$("#dropzone"); if(!dz) return;
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("drag");}));
  // stopPropagation: evita que o "drop" da janela inteira importe os mesmos arquivos de novo
  dz.addEventListener("drop",async e=>{ e.stopPropagation(); const files=await entriesFromDataTransfer(e.dataTransfer); if(files.length) runImportUI(files); });
}
async function verifyIntegrity(){
  const box=$("#integResult"); box.innerHTML="<span class='muted-c'>Verificando…</span>";
  let ok=0,bad=0; const fails=[];
  for(const f of APP.files){ const buf=await getBuf(f.id); if(!buf){bad++;fails.push(f.name+" (dados ausentes)");continue;}
    const h=await sha256Hex(buf); if(h===f.hash)ok++; else {bad++;fails.push(f.name+" (hash divergente)");} }
  box.innerHTML="<div class='row-line'><span>Íntegros</span><span class='v ok-c'>"+ok+"</span></div>"+
    "<div class='row-line'><span>Com problema</span><span class='v "+(bad?"danger-c":"ok-c")+"'>"+bad+"</span></div>"+
    (fails.length?("<div style='color:var(--danger);font-size:11.5px;margin-top:6px'>"+fails.map(esc).join("<br>")+"</div>"):"");
  toast(bad?("Integridade: "+bad+" problema(s).") : "Integridade: todos os "+ok+" arquivos OK.", bad?"err":"ok",4000);
}

/* =====================================================================
   VOLUME (para MPR e MIP) — construído só de séries com volume 3D válido
   ===================================================================== */
async function buildVolume(s){
  if(APP.volumes[s.id]) return APP.volumes[s.id];
  const m0=s.instances[0].meta; const nx=m0.cols, ny=m0.rows, nz=s.instances.length;
  if(nx*ny*nz*2 > 500*1024*1024) throw new Error("Volume grande demais para reconstruir neste navegador ("+nx+"×"+ny+"×"+nz+").");
  const vol=new Int16Array(nx*ny*nz);
  for(let z=0;z<nz;z++){
    const f=s.instances[z]; const buf=await getBuf(f.id);
    const fr=extractModality(f.meta,buf,0); if(!fr) throw new Error("Falha ao ler o corte "+(z+1));
    const base=z*nx*ny; const v=fr.values;
    for(let i=0;i<nx*ny;i++){ let x=v[i]; if(x>32767)x=32767; else if(x<-32768)x=-32768; vol[base+i]=x; }
  }
  const colSp=m0.pixelSpacing?m0.pixelSpacing[1]:1, rowSp=m0.pixelSpacing?m0.pixelSpacing[0]:1;
  const sliceSp=s._sliceSpacing||m0.sliceThickness||1;
  const V3={nx,ny,nz,vol,colSp,rowSp,sliceSp,series:s};
  APP.volumes[s.id]=V3; return V3;
}
function planeFrame(width,height,values){ return {color:false,mono1:false,width,height,values}; }

// Extrai planos do volume (vizinho mais próximo). Os cortes estão em ordem crescente de
// posição ao longo da normal (em geral: inferior -> superior), então nos planos coronal e
// sagital a linha da tela j corresponde a z = nz-1-j: o lado superior fica no topo,
// como no padrão radiológico.
function sliceAxial(V3,z){ const{nx,ny,vol}=V3; const out=new Float32Array(nx*ny); const b=z*nx*ny; for(let i=0;i<nx*ny;i++)out[i]=vol[b+i]; return planeFrame(nx,ny,out); }
function sliceCoronal(V3,y){ const{nx,ny,nz,vol}=V3; const out=new Float32Array(nx*nz); for(let j=0;j<nz;j++){ const b=(nz-1-j)*nx*ny+y*nx; for(let x=0;x<nx;x++)out[j*nx+x]=vol[b+x]; } return planeFrame(nx,nz,out); }
function sliceSagittal(V3,x){ const{nx,ny,nz,vol}=V3; const out=new Float32Array(ny*nz); for(let j=0;j<nz;j++){ const b=(nz-1-j)*nx*ny+x; for(let y=0;y<ny;y++)out[j*ny+y]=vol[b+y*nx]; } return planeFrame(ny,nz,out); }

function makeRange(id,min,max,val,cb){ const r=el("input",{type:"range",id,min,max,value:val,style:"width:120px",oninput:e=>cb(parseInt(e.target.value,10))}); return r; }

async function loadMPR(s){
  const info=$("#mprInfo"); info.innerHTML="<span class='muted-c'>Reconstruindo volume…</span>";
  try{ MPR.V3=await buildVolume(s); }catch(e){ info.innerHTML="<span class='danger-c'>"+esc(e.message)+"</span>"; return; }
  const V3=MPR.V3; MPR.x=Math.floor(V3.nx/2); MPR.y=Math.floor(V3.ny/2); MPR.z=Math.floor(V3.nz/2);
  const m0=s.instances[0].meta; const w=suggestWindow(m0,null); MPR.ww=Math.round(m0.windowWidth||2000); MPR.wl=Math.round(m0.windowCenter!=null?m0.windowCenter:400);
  $("#mprWW").value=MPR.ww; $("#mprWL").value=MPR.wl;
  wireMPRCanvas("mpr-ax","ax"); wireMPRCanvas("mpr-co","co"); wireMPRCanvas("mpr-sa","sa");
  drawMPRAll();
  info.innerHTML="<h3 style='margin-top:0'>Volume</h3>"+
    "<div class='row-line'><span>Dimensões</span><span class='v'>"+V3.nx+" × "+V3.ny+" × "+V3.nz+"</span></div>"+
    "<div class='row-line'><span>Espaçamento</span><span class='v'>"+V3.colSp.toFixed(2)+" × "+V3.rowSp.toFixed(2)+" × "+V3.sliceSp.toFixed(2)+" mm</span></div>"+
    "<div class='row-line'><span>Cursor (x,y,z)</span><span class='v' id='mprCursor'></span></div>";
  updMprCursor();
}
function drawMPRAll(){ if(!MPR.V3)return; drawMPRPlane("ax"); drawMPRPlane("co"); drawMPRPlane("sa"); updMprCursor(); }
function drawMPRPlane(id){
  const V3=MPR.V3; let frame,hx,hy,asp,lbl;
  if(id==="ax"){ frame=sliceAxial(V3,MPR.z); hx=MPR.x; hy=MPR.y; asp=V3.rowSp/V3.colSp; lbl="corte "+(MPR.z+1)+"/"+V3.nz; }
  else if(id==="co"){ frame=sliceCoronal(V3,MPR.y); hx=MPR.x; hy=V3.nz-1-MPR.z; asp=V3.sliceSp/V3.colSp; lbl="y "+(MPR.y+1)+"/"+V3.ny; }
  else { frame=sliceSagittal(V3,MPR.x); hx=MPR.y; hy=V3.nz-1-MPR.z; asp=V3.sliceSp/V3.rowSp; lbl="x "+(MPR.x+1)+"/"+V3.nx; }
  const src=frameToCanvas(frame,MPR.ww,MPR.wl,false);
  // cabe na largura da célula E numa altura máxima, para os três planos ficarem visíveis juntos
  const cv=$("#mpr-"+id);
  const avail=Math.max(120,(cv.parentElement.clientWidth||380)-16);
  const maxH=Math.max(140,(window.innerHeight-340)/2);   // 2 linhas de planos abaixo do cabeçalho
  const scale=Math.min(avail/frame.width, maxH/(frame.height*asp));
  cv.width=Math.max(1,Math.round(frame.width*scale)); cv.height=Math.max(1,Math.round(frame.height*scale*asp));
  cv.style.width=cv.width+"px"; cv.style.height=cv.height+"px";
  const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=true; ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(src,0,0,cv.width,cv.height);
  // cursor
  ctx.strokeStyle="rgba(79,156,249,.8)"; ctx.lineWidth=1;
  const px=hx*scale, py=hy*scale*asp;
  ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,cv.height); ctx.moveTo(0,py); ctx.lineTo(cv.width,py); ctx.stroke();
  const lab=$("#mpr-"+id+"-lbl"); if(lab)lab.textContent=lbl;
  cv._scale=scale; cv._asp=asp; cv._fw=frame.width; cv._fh=frame.height;
}
function wireMPRCanvas(cid,id){
  const cv=$("#"+cid); if(cv._wired)return; cv._wired=true;
  const handler=e=>{ const r=cv.getBoundingClientRect(); const sx=(e.clientX-r.left)/cv._scale; const sy=(e.clientY-r.top)/(cv._scale*cv._asp);
    const ix=clamp(Math.round(sx),0,cv._fw-1), iy=clamp(Math.round(sy),0,cv._fh-1);
    const nz=MPR.V3.nz;
    if(id==="ax"){ MPR.x=ix; MPR.y=iy; } else if(id==="co"){ MPR.x=ix; MPR.z=nz-1-iy; } else { MPR.y=ix; MPR.z=nz-1-iy; }
    drawMPRAll(); };
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);cv._drag=true;handler(e);});
  cv.addEventListener("pointermove",e=>{if(cv._drag)handler(e);});
  cv.addEventListener("pointerup",e=>{cv._drag=false;});
}
function updMprCursor(){ const c=$("#mprCursor"); if(c)c.textContent=MPR.x+", "+MPR.y+", "+MPR.z; }

  [["ax","Axial (de cima)"],["co","Coronal (de frente)"],["sa","Sagital (de lado)"]].forEach(([v,t])=>dirSel.append(el("option",{value:v,text:t})));
  bar.append(el("span",{class:"muted-c",style:"font-size:12px",text:"Série:"}),sel,
    el("span",{class:"muted-c",style:"font-size:12px",text:"Direção:"}),dirSel,
    el("span",{class:"muted-c",style:"font-size:12px",text:"Espessura (slab):"}),
    makeRange("mipSlab",0,400,0,v=>{MIPS.slab=v;scheduleMIP();$("#mipSlabLbl").textContent=v?(v+" cortes"):"volume inteiro";}),
    el("span",{id:"mipSlabLbl",class:"muted-c",style:"font-size:11px",text:"volume inteiro"}));
  p.append(bar);
  const bar2=el("div",{style:"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"});
  bar2.append(el("span",{class:"muted-c",style:"font-size:12px",text:"Posição do slab:"}),
    makeRange("mipPos",0,1000,500,v=>{MIPS.center=v/1000;scheduleMIP();}),
    el("span",{class:"muted-c",style:"font-size:12px",text:"Janela:"}),
    makeRange("mipWW",1,4000,MIPS.ww,v=>{MIPS.ww=v;scheduleMIP();}),makeRange("mipWL",-1024,3071,MIPS.wl,v=>{MIPS.wl=v;scheduleMIP();}));
  p.append(bar2);
  const cell=el("div",{class:"panel-box",style:"padding:10px;text-align:center"});
  cell.append(el("canvas",{id:"mipCanvas",style:"max-width:100%;background:#000;border-radius:6px"}));
  p.append(cell);
  sel.onchange=()=>loadMIP(volSeries[parseInt(sel.value,10)]);
  loadMIP(volSeries[0]);
}
async function loadMIP(s){
  const cell=$("#mipCanvas").parentElement;
  try{ MIPS.V3=await buildVolume(s); }catch(e){ cell.innerHTML="<span class='danger-c'>"+esc(e.message)+"</span>"; return; }
  const m0=s.instances[0].meta; MIPS.ww=Math.round(m0.windowWidth||2000); MIPS.wl=Math.round(m0.windowCenter!=null?m0.windowCenter:400);
  $("#mipWW").value=MIPS.ww; $("#mipWL").value=MIPS.wl; setupSlab(); drawMIP();
}
function setupSlab(){ const V3=MIPS.V3; if(!V3)return; const max=MIPS.dir==="ax"?V3.nz:MIPS.dir==="co"?V3.ny:V3.nx; const sl=$("#mipSlab"); if(sl)sl.max=max; }
let mipRaf=0;
function scheduleMIP(){ if(mipRaf)return; mipRaf=requestAnimationFrame(()=>{ mipRaf=0; drawMIP(); }); }
function drawMIP(){
  const V3=MIPS.V3; if(!V3)return; const {nx,ny,nz,vol}=V3; const nxy=nx*ny; const dir=MIPS.dir;
  const axisLen = dir==="ax"?nz:dir==="co"?ny:nx;
  // slab 0 = volume inteiro; senão, "slab" cortes centrados na posição escolhida
  let a0=0,a1=axisLen-1;
  if(MIPS.slab>0){ const c=Math.round(MIPS.center*(axisLen-1)); a0=clamp(c-Math.floor(MIPS.slab/2),0,axisLen-1); a1=clamp(a0+MIPS.slab-1,0,axisLen-1); }
  let w,h,asp,out;
  if(dir==="ax"){ // projeta ao longo de z
    w=nx;h=ny;asp=V3.rowSp/V3.colSp; out=new Float32Array(w*h).fill(-32768);
    for(let z=a0;z<=a1;z++){ const b=z*nxy; for(let i=0;i<nxy;i++){ const v=vol[b+i]; if(v>out[i])out[i]=v; } }
  }else if(dir==="co"){ // projeta ao longo de y; linha da tela = nz-1-z (superior no topo)
    w=nx;h=nz;asp=V3.sliceSp/V3.colSp; out=new Float32Array(w*h).fill(-32768);
    for(let z=0;z<nz;z++){ const row=(nz-1-z)*nx, b=z*nxy;
      for(let y=a0;y<=a1;y++){ const by=b+y*nx; for(let x=0;x<nx;x++){ const v=vol[by+x]; if(v>out[row+x])out[row+x]=v; } } }
  }else{ // projeta ao longo de x
    w=ny;h=nz;asp=V3.sliceSp/V3.rowSp; out=new Float32Array(w*h).fill(-32768);
    for(let z=0;z<nz;z++){ const row=(nz-1-z)*ny, b=z*nxy;
      for(let y=0;y<ny;y++){ const by=b+y*nx; let m=-32768; for(let x=a0;x<=a1;x++){ const v=vol[by+x]; if(v>m)m=v; } out[row+y]=m; } }
  }
  const src=frameToCanvas(planeFrame(w,h,out),MIPS.ww,MIPS.wl,false);
  const cv=$("#mipCanvas"); const target=Math.min(640, (cv.parentElement.clientWidth||600)); const scale=target/w;
  cv.width=target; cv.height=Math.round(h*scale*asp); const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=true;
  ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(src,0,0,cv.width,cv.height);
}

/* =====================================================================
   PÁGINA FOCO NO POLEGAR (estação dedicada à mão/punho)
   ===================================================================== */
const THUMB={series:null,index:0,frame:null,zoom:3,ww:WINDOW_PRESETS[0].ww,wl:WINDOW_PRESETS[0].wl};
function renderThumb(){
  const p=$("#page-thumb"); p.innerHTML="";
  const dicomSeries=APP.studies.flatMap(st=>st.series).filter(s=>s.kind==="dicom"&&!s.instances[0].meta.compressed);
  if(!dicomSeries.length){ p.style.padding="22px 26px"; p.append(el("h1",{text:"Punho e mão"}),el("div",{class:"muted-c",text:"Nenhuma série disponível."})); return; }
  p.style.padding="0";
  const top=el("div",{style:"padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap"});
  const sel=el("select",{class:"mini"}); dicomSeries.forEach((s,i)=>sel.append(el("option",{value:i,text:s.desc||"Série"})));
  top.append(el("div",{},el("div",{style:"font-size:15px;font-weight:650",text:"Punho e mão"}),
    el("div",{class:"muted-c",style:"font-size:11.5px",text:"Janela óssea · Lupa"})),
    el("span",{style:"flex:1"}),el("span",{class:"muted-c",style:"font-size:12px",text:"Série:"}),sel,
    el("button",{class:"btn ghost",text:"Abrir MPR",onclick:()=>setView("mpr")}));
  p.append(top);
  const main=el("div",{style:"flex:1;display:flex;min-height:0"});
  const left=el("div",{style:"flex:1;position:relative;background:#000;min-width:0"},
    el("canvas",{id:"thumbCanvas",style:"position:absolute;inset:0;width:100%;height:100%;cursor:crosshair"}),
    el("canvas",{id:"thumbLoupe",width:180,height:180,style:"position:absolute;right:12px;top:12px;border:1px solid var(--accent);border-radius:8px;background:#000;pointer-events:none"}));
  const side=el("div",{style:"width:240px;border-left:1px solid var(--border);overflow:auto;padding:12px;background:var(--surface)"});
  const ctrl=el("div",{});
  ctrl.append(el("div",{class:"muted-c",style:"font-size:11px;margin-bottom:4px",id:"thumbSliceLbl",text:"Corte"}),
    makeRange("thumbSlice",0,0,0,v=>{THUMB.index=v;loadThumbInstance();}),
    el("div",{class:"muted-c",style:"font-size:11px;margin:8px 0 4px",text:"Zoom da lupa"}),
    makeRange("thumbZoom",2,8,THUMB.zoom,v=>{THUMB.zoom=v;}),
    el("div",{class:"muted-c",style:"font-size:11px;margin:8px 0 4px",text:"Janela (WW / WL)"}),
    makeRange("thumbWW",1,4000,THUMB.ww,v=>{THUMB.ww=v;redrawThumbWindow();}),
    makeRange("thumbWL",-1024,3071,THUMB.wl,v=>{THUMB.wl=v;redrawThumbWindow();}),
    el("div",{style:"display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"},
      ...WINDOW_PRESETS.slice(0,3).map(pr=>el("button",{class:"btn ghost",style:"height:26px;padding:0 8px;font-size:11px",text:pr.name,
        onclick:()=>{THUMB.ww=pr.ww;THUMB.wl=pr.wl;$("#thumbWW").value=pr.ww;$("#thumbWL").value=pr.wl;redrawThumbWindow();}}))));
  side.append(ctrl);
  main.append(left,side); p.append(main);
  sel.onchange=()=>selectThumbSeries(dicomSeries[parseInt(sel.value,10)]);
  selectThumbSeries(dicomSeries[0]);
}
async function selectThumbSeries(s){ THUMB.series=s; THUMB.index=Math.floor(s.instances.length/2);
  const r=$("#thumbSlice"); r.max=s.instances.length-1; r.value=THUMB.index; await loadThumbInstance(); wireThumbLoupe(); }
async function loadThumbInstance(){
  const s=THUMB.series; const f=s.instances[THUMB.index]; const buf=await getBuf(f.id);
  const fr=extractModality(f.meta,buf,0); if(!fr)return; THUMB.frame=fr;
  const lbl=$("#thumbSliceLbl"); if(lbl) lbl.textContent="Corte "+(THUMB.index+1)+" / "+s.instances.length;
  redrawThumbWindow();
  // dica inicial na lupa (antes do primeiro movimento do cursor)
  const lp=$("#thumbLoupe"); if(lp&&!lp._used){ const c=lp.getContext("2d"); c.clearRect(0,0,180,180);
    c.fillStyle="#6B7C91"; c.font="12px system-ui,sans-serif"; c.textAlign="center";
    c.fillText("Passe o cursor",90,84); c.fillText("sobre a imagem",90,102); }
}
function redrawThumbWindow(){ if(!THUMB.frame)return; THUMB.src=frameToCanvas(THUMB.frame,THUMB.ww,THUMB.wl,false); drawThumb(); }
function drawThumb(){
  const cv=$("#thumbCanvas"); if(!cv||!THUMB.src)return; const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=cv.clientWidth,h=cv.clientHeight; cv.width=w*dpr;cv.height=h*dpr; const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h); const src=THUMB.src; const sc=Math.min(w/src.width,h/src.height)*0.96;
  const dw=src.width*sc, dh=src.height*sc; THUMB._rect={x:(w-dw)/2,y:(h-dh)/2,sc};
  ctx.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh);
}
function wireThumbLoupe(){ const cv=$("#thumbCanvas"); if(cv._wired)return; cv._wired=true;
  cv.addEventListener("pointermove",e=>{ const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
    const rc=THUMB._rect; if(!rc)return; const ix=(mx-rc.x)/rc.sc, iy=(my-rc.y)/rc.sc; const lp=$("#thumbLoupe"); lp._used=true; const lc=lp.getContext("2d");
    lc.clearRect(0,0,180,180); lc.imageSmoothingEnabled=false; const z=THUMB.zoom; const sw=180/z;
    lc.drawImage(THUMB.src, ix-sw/2, iy-sw/2, sw, sw, 0,0,180,180);
    lc.strokeStyle="rgba(88,215,209,.9)"; lc.beginPath(); lc.moveTo(90,80);lc.lineTo(90,100);lc.moveTo(80,90);lc.lineTo(100,90);lc.stroke();
  });
  if(!THUMB._resizeWired){ THUMB._resizeWired=true;
    window.addEventListener("resize",()=>{ if($("#view-thumb").classList.contains("active")) drawThumb(); }); }
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
async function boot(){
  captureEmbedded();   // antes de qualquer mudança no DOM
  // navegação do rail
  $$("#rail .nav").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
  $("#btnImportTop").onclick=()=>setView("import");
  $("#btnExportTop").onclick=()=>setView("export");
  $("#btnImportEmpty").onclick=()=>setView("import");
  const bs=$("#btnSeries"); if(bs) bs.onclick=()=>$("#sidebar").classList.toggle("open");
  $("#modalClose").onclick=closeModal;
  $("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

  // seletores de arquivo
  $("#fileInput").addEventListener("change",e=>{ const f=Array.from(e.target.files||[]); e.target.value=""; if(f.length) runImportUI(f); });
  $("#folderInput").addEventListener("change",e=>{ const f=Array.from(e.target.files||[]); e.target.value=""; if(f.length) runImportUI(f); });

  // arrastar e soltar em qualquer lugar da janela
  window.addEventListener("dragover",e=>{ e.preventDefault(); });
  window.addEventListener("drop",async e=>{ e.preventDefault(); const files=await entriesFromDataTransfer(e.dataTransfer); if(files.length) runImportUI(files); });

  initViewerInteraction();
  initControls();
  buildToolbar();

  try{ APP.db=await openDB(); }
  catch(e){ APP.db=null; toast("Armazenamento local indisponível neste navegador/modo. Os dados ficarão só na memória — use o backup .zip.","warn",9000); }
  try{ await loadAllFromDB(); }catch(e){ console.error(e); }
  try{ await loadEmbedded(); }catch(e){ hideLoading(); console.error(e); toast("Falha ao carregar o exame embutido.","err",8000); }
  renderSeriesList();
  updateTopStatus();
  setView(APP.files.length?"overview":"import");
  APP.started=true;
}
document.addEventListener("DOMContentLoaded",boot);
</script>
