<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tomografia Computadorizada</title>
<meta name="description" content="Tomografia computadorizada: imagens, reconstruções, vídeos e laudo.">
<style>
/* ============================================================
   SISTEMA DE DESIGN — WORKSTATION DE RADIOLOGIA (DARK-FIRST)
   ============================================================ */
:root{
  --bg:#080B10;            /* fundo primário */
  --surface:#111722;       /* superfície secundária */
  --panel:#18212D;         /* painéis elevados */
  --panel-2:#1E2836;       /* painel mais alto */
  --border:#273444;        /* bordas finas */
  --border-soft:#1c2531;
  --text:#F2F5F8;          /* texto primário */
  --muted:#9AAABD;         /* texto secundário */
  --muted-2:#6B7C91;
  --accent:#4F9CF9;        /* seleção / foco */
  --accent-2:#58D7D1;      /* medições diagnósticas */
  --warn:#F2B84B;
  --danger:#F26A6A;
  --ok:#5AD19A;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail:56px;
  --sidebar:272px;
  --inspector:300px;
  --topbar:48px;
  --timeline:72px;
  --radius:8px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:13px;line-height:1.45;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#223042;border-radius:6px;border:2px solid var(--surface)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none !important}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- LAYOUT PRINCIPAL ---------- */
#app{display:flex;flex-direction:column;height:100%}
#topbar{
  height:var(--topbar);flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:0 12px;background:linear-gradient(180deg,#121a26,#0e141d);
  border-bottom:1px solid var(--border);z-index:30;
}
#topbar .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
#topbar .brand .logo{
  width:26px;height:26px;border-radius:6px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#2f6fd0);color:#fff;font-weight:800;font-size:12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
}
#topbar .exam-title{font-size:12.5px;color:var(--muted);font-weight:500;max-width:36vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
  background:var(--panel);border:1px solid var(--border);font-size:11px;color:var(--muted);
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pill.warn .dot{background:var(--warn)}
.pill.off .dot{background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}
.tbtn{
  height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:12px;display:inline-flex;align-items:center;gap:7px;
  transition:.12s;
}
.tbtn:hover{background:var(--panel-2);border-color:#32455a}
.tbtn.primary{background:linear-gradient(180deg,#2f6fd0,#2660bd);border-color:#3a74cf}
.tbtn.primary:hover{filter:brightness(1.08)}
.tbtn svg{width:15px;height:15px}

#body{flex:1;display:flex;min-height:0}

/* ---------- RAIL (navegação de seções) ---------- */
#rail{
  width:var(--rail);flex:0 0 auto;background:#0b1118;border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;z-index:20;
}
#rail .nav{
  width:42px;height:42px;border-radius:9px;border:1px solid transparent;background:transparent;
  display:grid;place-items:center;color:var(--muted-2);position:relative;transition:.12s;
}
#rail .nav:hover{color:var(--text);background:var(--panel)}
#rail .nav.active{color:#fff;background:var(--panel-2);border-color:var(--border)}
#rail .nav.active::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
#rail .nav svg{width:20px;height:20px}
#rail .nav .tip{
  position:absolute;left:50px;background:#0c1420;border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:6px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;
  transform:translateX(-4px);transition:.12s;z-index:50;box-shadow:var(--shadow)
}
#rail .nav:hover .tip{opacity:1;transform:translateX(0)}
#rail .sep{width:28px;height:1px;background:var(--border);margin:6px 0}
#rail .grow{flex:1}

/* ---------- SIDEBAR ESQUERDA ---------- */
#sidebar{
  width:var(--sidebar);flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.sb-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-head h3{margin:0;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sb-scroll{flex:1;overflow:auto;padding:6px}
.series-card{
  display:flex;gap:9px;padding:8px;border-radius:8px;border:1px solid transparent;margin-bottom:5px;
  cursor:pointer;transition:.12s;align-items:center;
}
.series-card:hover{background:var(--panel);border-color:var(--border-soft)}
.series-card.active{background:var(--panel-2);border-color:var(--accent)}
.series-card .thumb{
  width:52px;height:52px;border-radius:6px;background:#05080c;border:1px solid var(--border);
  flex:0 0 auto;object-fit:cover;display:block;image-rendering:auto;
}
.series-card .meta{min-width:0;flex:1}
.series-card .meta .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-card .meta .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.series-card .meta .badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:9.5px;padding:1.5px 6px;border-radius:5px;border:1px solid var(--border);color:var(--muted);background:#0d141d}
.tag.dcm{color:#9fd0ff;border-color:#24435f}
.tag.img{color:#b8e6c4;border-color:#275741}
.tag.vid{color:#e9c8f5;border-color:#4b2c57}
.tag.pdf{color:#ffd0a6;border-color:#5c3f22}
.tag.vol{color:var(--accent-2);border-color:#235c58}
.empty-note{padding:18px 14px;color:var(--muted-2);font-size:12px;text-align:center;line-height:1.6}

/* ---------- ÁREA CENTRAL ---------- */
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#05070a;position:relative}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.active{display:flex}

/* barra de ferramentas do viewer */
#toolbar{
  height:40px;flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:0 8px;
  background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;
}
.tool{
  height:28px;min-width:28px;padding:0 7px;border-radius:6px;border:1px solid transparent;background:transparent;
  color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;transition:.1s
}
.tool:hover{color:var(--text);background:var(--panel)}
.tool.active{color:#fff;background:var(--panel-2);border-color:var(--accent)}
.tool svg{width:16px;height:16px}
.tool-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:0 0 auto}
.tool-group{display:flex;align-items:center;gap:2px}
select.mini,input.mini{
  height:28px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;
  font-size:11.5px;padding:0 7px;outline:none
}
select.mini:focus,input.mini:focus{border-color:var(--accent)}

/* área do canvas */
#stage{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(1200px 600px at 50% -10%,#0a111b 0,#05070a 60%)}
.viewport{position:absolute;inset:0;display:grid;place-items:center}
#mainCanvas,#overlayCanvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
#overlayCanvas{pointer-events:none}
.hud{position:absolute;font:11px/1.4 var(--mono);color:#cfe0f2;text-shadow:0 1px 2px #000;pointer-events:none;z-index:5}
.hud.tl{top:8px;left:10px}
.hud.tr{top:8px;right:10px;text-align:right}
.hud.bl{bottom:8px;left:10px}
.hud.br{bottom:8px;right:10px;text-align:right}
.hud .k{color:var(--muted-2)}
.hud .warnote{color:var(--warn)}
#stageMsg{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);
  padding:30px;z-index:8
}
#stageMsg .box{max-width:460px}
#stageMsg h2{font-size:15px;color:var(--text);margin:0 0 8px}
#stageMsg p{margin:6px 0;font-size:12.5px;line-height:1.6}
.scrollbar-v{position:absolute;right:4px;top:10px;bottom:10px;width:4px;background:#121a24;border-radius:3px;z-index:6}
.scrollbar-v .knob{position:absolute;left:-1px;width:6px;background:var(--accent);border-radius:3px;min-height:16px}

/* ---------- INSPECTOR DIREITO ---------- */
#inspector{
  width:var(--inspector);flex:0 0 auto;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0
}
.insp-scroll{flex:1;overflow:auto}
.insp-sec{border-bottom:1px solid var(--border)}
.insp-sec > h4{
  margin:0;padding:9px 12px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none
}
.insp-sec > h4 .chev{transition:.15s;color:var(--muted-2)}
.insp-sec.closed > h4 .chev{transform:rotate(-90deg)}
.insp-sec .content{padding:4px 12px 12px}
.insp-sec.closed .content{display:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:11.5px;border-bottom:1px dashed var(--border-soft)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{color:var(--text);text-align:right;font-family:var(--mono);word-break:break-all}
.ww-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.ww-row label{width:36px;color:var(--muted);font-size:11px}
.ww-row input[type=range]{flex:1}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.preset-grid button{
  height:26px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:11px
}
.preset-grid button:hover{border-color:var(--accent)}
.meas-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border-soft);font-size:11.5px}
.meas-item .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.meas-item .mtxt{flex:1;min-width:0}
.meas-item button{background:transparent;border:0;color:var(--muted-2);font-size:14px;padding:0 4px}
.meas-item button:hover{color:var(--danger)}

/* ---------- TIMELINE INFERIOR ---------- */
#timeline{
  height:var(--timeline);flex:0 0 auto;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 14px
}
#timeline .cine{display:flex;align-items:center;gap:4px}
.cbtn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;color:var(--text)}
.cbtn:hover{border-color:var(--accent)}
.cbtn svg{width:16px;height:16px}
#timeline .track{flex:1;display:flex;flex-direction:column;gap:5px}
#timeline .track .labels{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}
#sliceRange{width:100%}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:4px;background:#1d2a3a;border-radius:3px;outline:none
}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #0b1118;cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #0b1118;cursor:pointer}

/* ---------- SEÇÕES DE PÁGINA (overview, media, archive, etc) ---------- */
.page{flex:1;overflow:auto;padding:22px 26px;background:
  radial-gradient(900px 500px at 80% -10%,#0a111b 0,#05070a 55%)}
.page h1{font-size:19px;margin:0 0 4px;font-weight:650}
.page .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:11.5px;margin-top:2px}
.stat .l2{color:var(--muted-2);font-size:10.5px;margin-top:6px}
.panel-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}
.panel-box h3{margin:0 0 10px;font-size:13.5px}
.row-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.row-line:last-child{border-bottom:0}
.row-line .v{font-family:var(--mono);color:var(--muted)}
.ok-c{color:var(--ok)} .warn-c{color:var(--warn)} .danger-c{color:var(--danger)} .muted-c{color:var(--muted)}

/* grade de mídia / miniaturas */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media-tile{background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden;cursor:pointer;transition:.12s}
.media-tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.media-tile .mt-thumb{aspect-ratio:1;background:#05080c;display:grid;place-items:center;overflow:hidden}
.media-tile .mt-thumb img,.media-tile .mt-thumb canvas{width:100%;height:100%;object-fit:cover}
.media-tile .mt-info{padding:8px 9px}
.media-tile .mt-info .t{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-tile .mt-info .s{font-size:10.5px;color:var(--muted);margin-top:2px}

/* explorer / árvore */
.tree{font-family:var(--mono);font-size:12px}
.tnode{padding:4px 6px;border-radius:6px;display:flex;align-items:center;gap:8px}
.tnode:hover{background:var(--panel)}
.tnode.depth1{padding-left:22px}
.tnode.depth2{padding-left:42px}
.tnode .exp{width:14px;color:var(--muted-2)}
.tnode .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .sz{color:var(--muted-2);font-size:11px}
.tnode .dl{color:var(--accent);font-size:11px;cursor:pointer;opacity:0;transition:.1s}
.tnode:hover .dl{opacity:1}

/* dropzone / import */
.dropzone{
  border:1.5px dashed #33465c;border-radius:14px;padding:38px 24px;text-align:center;color:var(--muted);
  background:#0a111b;transition:.15s;cursor:pointer
}
.dropzone.drag{border-color:var(--accent);background:#0e1a2a;color:var(--text)}
.dropzone .big{font-size:15px;color:var(--text);margin:10px 0 4px}
.progress{height:8px;background:#0e1620;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .15s}

/* toast */
#loadingOverlay{position:fixed;inset:0;z-index:120;background:rgba(5,8,12,.92);display:grid;place-items:center}
#loadingOverlay .lo-box{width:min(420px,86vw)}
#loadingOverlay .lo-t{font-size:13px;color:var(--text);margin-bottom:10px;text-align:center}
#toasts{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0c1521;border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow);max-width:80vw}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.err{border-left-color:var(--danger)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(2,5,9,.7);backdrop-filter:blur(3px);z-index:90;display:none;place-items:center;padding:20px}
#modal.open{display:grid}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:860px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-card header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
#btnSeries{display:none}
/* telas até 1600px: ferramentas só com ícone (nome no tooltip) para caber tudo sem rolar */
@media (max-width:1600px){ #toolbar .tool > span{display:none} }
@media (max-width:820px){ #btnSeries{display:inline-flex} }
.modal-card header h3{margin:0;flex:1;font-size:14px}
.modal-card .mc-body{padding:18px}
.modal-card .mc-body img,.modal-card .mc-body video,.modal-card .mc-body embed,.modal-card .mc-body iframe{max-width:100%;border-radius:8px;background:#000}

.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(180deg,#2f6fd0,#2660bd);border-color:#3a74cf}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5c2b2b;color:#ffc4c4}
.btn.danger:hover{background:#2a1414}

/* responsivo */
@media (max-width:1100px){
  :root{--inspector:0px}
  #inspector{display:none}
}
@media (max-width:820px){
  :root{--sidebar:0px}
  #sidebar{position:absolute;left:var(--rail);top:0;bottom:0;width:260px;z-index:25;transform:translateX(-110%);transition:.2s;box-shadow:var(--shadow)}
  #sidebar.open{transform:translateX(0)}
  #topbar .exam-title{display:none}
}
@media (max-width:560px){
  #timeline{height:64px;gap:8px;padding:0 8px}
  .page{padding:16px 14px}
  /* barra superior compacta: status fica na Visão geral; botões viram só ícone */
  #topbar{gap:8px;padding:0 8px}
  #topbar .pill{display:none}
  #topbar .tbtn .lbl{display:none}
  #topbar .brand{white-space:nowrap}
  /* linha do tempo: prioriza o controle de cortes */
  .cine-opts,.cbtn-ext{display:none !important}
}
#topbar{overflow:hidden}
#topbar > *{flex-shrink:0}
#topbar .exam-title,#topbar .spacer{flex-shrink:1;min-width:0}
</style>
</head>
<body>
<div id="app">
  <!-- TOPO -->
  <div id="topbar">
    <button class="tbtn" id="btnSeries" title="Séries" aria-label="Abrir lista de séries">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <div class="logo">TC</div>
      <div>
        <div>Tomografia Computadorizada</div>
      </div>
    </div>
    <div class="exam-title" id="examTitle"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnImportTop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
      <span class="lbl">Importar</span>
    </button>
    <button class="tbtn primary" id="btnExportTop" title="Backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>
      <span class="lbl">Backup</span>
    </button>
  </div>

  <div id="body">
    <!-- RAIL -->
    <div id="rail">
      <button class="nav active" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="tip">Visão geral</span></button>
      <button class="nav" data-view="viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.4"/></svg><span class="tip">Visualizador</span></button>

<script>
"use strict";
/* =====================================================================
   ARQUIVO TC — Visualizador independente e offline (JavaScript puro)
   Nenhuma dependência externa. Nenhuma conexão de rede. Tudo local.
   ===================================================================== */
const APP = {
  db:null,
  files:[],            // todos os ativos importados {id,name,size,type,kind,hash,buf,meta,...}
  studies:[],          // hierarquia estudo->série->instâncias
  current:{ series:null, index:0, image:null },
  view:{ zoom:1, panX:0, panY:0, rotate:0, flipH:false, flipV:false, invert:false, ww:1500, wl:300 },
  tool:"wwwl",
  cine:{ playing:false, fps:12, loop:true, timer:null },
  measurements:{},     // por imageId -> array
  volumes:{},          // seriesId -> volume reslice
  started:false,
};

/* ---------- atalhos DOM ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const el = (tag,props={},...kids)=>{
  const n=document.createElement(tag);
  for(const k in props){
    if(k==="class") n.className=props[k];
    else if(k==="html") n.innerHTML=props[k];
    else if(k==="text") n.textContent=props[k];
    else if(k.startsWith("on")&&typeof props[k]==="function") n.addEventListener(k.slice(2),props[k]);
    else if(props[k]!=null) n.setAttribute(k,props[k]);
  }
  for(const c of kids){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;
};

/* ---------- formatação ---------- */
function fmtBytes(b){
  if(b==null) return "—";
  if(b<1024) return b+" B";
  const u=["KB","MB","GB","TB"]; let i=-1,n=b;
  do{ n/=1024; i++; }while(n>=1024&&i<u.length-1);
  return n.toFixed(n<10?2:1)+" "+u[i];
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function nowStamp(){ return new Date().toISOString().replace(/[:.]/g,"-").slice(0,19); }

/* ---------- toast ---------- */
function toast(msg,type="",ms=3200){
  const t=el("div",{class:"toast "+type,html:msg});
  $("#toasts").append(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition=".3s"; setTimeout(()=>t.remove(),320); }, ms);
}

/* ---------- modal ---------- */
function openModal(title,node){
  $("#modalTitle").textContent=title;
  const body=$("#modalBody"); body.innerHTML="";

function closeModal(){ $("#modal").classList.remove("open"); $("#modalBody").innerHTML="";
  if(APP._modalUrl){ URL.revokeObjectURL(APP._modalUrl); APP._modalUrl=null; } }

/* ---------- navegação entre seções ---------- */

/* =====================================================================
   SHA-256 — usa WebCrypto quando disponível; senão, implementação JS
   (garante o relatório de integridade mesmo offline em file://)
   ===================================================================== */
async function sha256Hex(buf){
  try{
    if(crypto && crypto.subtle){
      const d=await crypto.subtle.digest("SHA-256", buf);
      return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){ /* cai para JS */ }
  return sha256JS(new Uint8Array(buf));
}
function sha256JS(data){
  function rrot(x,n){ return (x>>>n)|(x<<(32-n)); }
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=data.length, bitLen=l*8;
  const withOne=l+1; const k=(56-withOne%64+64)%64;
  const total=withOne+k+8;
  const m=new Uint8Array(total); m.set(data); m[l]=0x80;
  const dv=new DataView(m.buffer);
  dv.setUint32(total-4, bitLen>>>0, false);
  dv.setUint32(total-8, Math.floor(bitLen/0x100000000), false);
  const w=new Uint32Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4,false);
    for(let t=16;t<64;t++){
      const s0=rrot(w[t-15],7)^rrot(w[t-15],18)^(w[t-15]>>>3);
      const s1=rrot(w[t-2],17)^rrot(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rrot(e,6)^rrot(e,11)^rrot(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])|0;
      const S0=rrot(a,2)^rrot(a,13)^rrot(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}

/* ---------- CRC32 (para o gerador de ZIP de backup) ---------- */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }

/* =====================================================================
   INDEXEDDB — armazenamento local permanente dos arquivos originais
   ===================================================================== */
const DB_NAME="arquivo_tc_mao", DB_VER=1;
function openDB(){
  return new Promise((res,rej)=>{
    let req;
    try{ req=indexedDB.open(DB_NAME,DB_VER); }
    catch(e){ return rej(e); }
    req.onupgradeneeded=(ev)=>{
      const db=ev.target.result;
      if(!db.objectStoreNames.contains("files")) db.createObjectStore("files",{keyPath:"id"});
      if(!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs");      // id -> ArrayBuffer original
      if(!db.objectStoreNames.contains("meta"))  db.createObjectStore("meta");       // chave->valor (medições, config)
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
// Reserva em memória: usada só se o navegador bloquear o IndexedDB (ex.: modo privado).
// Nesse caso os dados duram até fechar a aba — o backup .zip continua funcionando.
const MEM={files:new Map(),blobs:new Map(),meta:new Map()};
function tx(store,mode="readonly"){ return APP.db.transaction(store,mode).objectStore(store); }
function idbPut(store,val,key){
  if(!APP.db){ MEM[store].set(key!==undefined?key:val.id,val); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=key!==undefined?tx(store,"readwrite").put(val,key):tx(store,"readwrite").put(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function idbGet(store,key){
  if(!APP.db) return Promise.resolve(MEM[store].get(key));
  return new Promise((res,rej)=>{ const r=tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
}
function idbGetAll(store){
  if(!APP.db) return Promise.resolve(Array.from(MEM[store].values()));
  return new Promise((res,rej)=>{ const r=tx(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
}
function idbDel(store,key){
  if(!APP.db){ MEM[store].delete(key); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=tx(store,"readwrite").delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}
function idbClear(store){
  if(!APP.db){ MEM[store].clear(); return Promise.resolve(); }
  return new Promise((res,rej)=>{ const r=tx(store,"readwrite").clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}

/* salva um ativo (registro leve em "files"; bytes originais em "blobs") */
async function saveAsset(rec, buf){
  await idbPut("files", rec);
  if(buf) await idbPut("blobs", buf, rec.id);
}
async function getBuf(id){ return await idbGet("blobs", id); }

/* carrega tudo do banco para a memória no início */
async function loadAllFromDB(){
  const recs=await idbGetAll("files");
  APP.files=recs.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const meas=await idbGet("meta","measurements");
  APP.measurements = meas||{};
  buildHierarchy();
}

/* persistência de armazenamento (pede ao navegador para não apagar) */
async function requestPersist(){
  try{ if(navigator.storage&&navigator.storage.persist){ const g=await navigator.storage.persisted(); if(!g) await navigator.storage.persist(); } }catch(e){}
}
async function storageEstimate(){
  try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); return e; } }catch(e){}
  return null;
}

/* =====================================================================
   LEITOR DICOM — JavaScript puro
   Suporta: VR Explícito/Implícito, Little/Big Endian, nativo (não comprimido),
   8/16 bits, com/sem sinal, multi-frame, MONOCHROME1/2 e RGB básico.
   Sintaxes comprimidas são DETECTADAS e sinalizadas (bytes originais preservados).
   ===================================================================== */
const TS={
  "1.2.840.10008.1.2":    {implicit:true, little:true,  name:"Implicit VR Little Endian"},
  "1.2.840.10008.1.2.1":  {implicit:false,little:true,  name:"Explicit VR Little Endian"},
  "1.2.840.10008.1.2.1.99":{implicit:false,little:true, name:"Deflated Explicit VR LE", deflated:true},
  "1.2.840.10008.1.2.2":  {implicit:false,little:false, name:"Explicit VR Big Endian"},
};
const COMPRESSED_TS={
  "1.2.840.10008.1.2.4.50":"JPEG Baseline",
  "1.2.840.10008.1.2.4.51":"JPEG Extended",
  "1.2.840.10008.1.2.4.57":"JPEG Lossless",
  "1.2.840.10008.1.2.4.70":"JPEG Lossless SV1",
  "1.2.840.10008.1.2.4.80":"JPEG-LS Lossless",
  "1.2.840.10008.1.2.4.81":"JPEG-LS Near-Lossless",
  "1.2.840.10008.1.2.4.90":"JPEG 2000 Lossless",
  "1.2.840.10008.1.2.4.91":"JPEG 2000",
  "1.2.840.10008.1.2.5":"RLE Lossless",
  "1.2.840.10008.1.2.4.201":"HTJ2K Lossless",

  // vídeo encapsulado em DICOM (usado por alguns sistemas para reconstruções 3D em movimento)
  "1.2.840.10008.1.2.4.100":"Vídeo MPEG-2 em DICOM",
  "1.2.840.10008.1.2.4.101":"Vídeo MPEG-2 (alta definição) em DICOM",
  "1.2.840.10008.1.2.4.102":"Vídeo H.264 em DICOM",
  "1.2.840.10008.1.2.4.103":"Vídeo H.264 (BD) em DICOM",
  "1.2.840.10008.1.2.4.104":"Vídeo H.264 2D em DICOM",
  "1.2.840.10008.1.2.4.105":"Vídeo H.264 3D em DICOM",
  "1.2.840.10008.1.2.4.106":"Vídeo H.264 estéreo em DICOM",
  "1.2.840.10008.1.2.4.107":"Vídeo HEVC em DICOM",
  "1.2.840.10008.1.2.4.108":"Vídeo HEVC Main10 em DICOM",
};
const isVideoTS=uid=>/^1\.2\.840\.10008\.1\.2\.4\.10[0-8]$/.test(uid||"");
const LONG_VR=new Set(["OB","OW","OF","OD","OL","SQ","UT","UN","UR","UC"]);

function looksDicom(u8){
  if(u8.length>132 && u8[128]===0x44&&u8[129]===0x49&&u8[130]===0x43&&u8[131]===0x4D) return true; // 'DICM'
  // heurística: começa com group 0008 em LE (fallback p/ arquivos sem preâmbulo)
  if(u8.length>8 && u8[0]===0x08 && u8[1]===0x00) return true;
  return false;
}

function parseDicom(buffer){
  const u8=new Uint8Array(buffer);
  const dv=new DataView(buffer);
  let pos=0;
  const hasPreamble = u8.length>132 && u8[128]===0x44&&u8[129]===0x49&&u8[130]===0x43&&u8[131]===0x4D;
  if(hasPreamble) pos=132;

  const tags={}; // "ggggeeee" -> {vr,off,len}
  // --- File Meta (group 0002) é sempre Explicit VR LE ---
  let tsUID=null;
  function readElementHeader(p, implicit, little){
    const g=little?dv.getUint16(p,true):dv.getUint16(p,false);
    const e=little?dv.getUint16(p+2,true):dv.getUint16(p+2,false);
    let vr=null,len,hlen;
    if(implicit){
      len=little?dv.getUint32(p+4,true):dv.getUint32(p+4,false); hlen=8;
    }else{
      vr=String.fromCharCode(u8[p+4],u8[p+5]);
      if(LONG_VR.has(vr)){ len=little?dv.getUint32(p+8,true):dv.getUint32(p+8,false); hlen=12; }
      else{ len=little?dv.getUint16(p+6,true):dv.getUint16(p+6,false); hlen=8; }
    }
    return {g,e,vr,len,hlen};
  }

  // percorre File Meta até sair do grupo 0002
  if(hasPreamble){
    while(pos+8<=u8.length){
      const h=readElementHeader(pos,false,true);
      if(h.g!==0x0002) break;
      const voff=pos+h.hlen;
      const key=tagKey(h.g,h.e);
      tags[key]={vr:h.vr,off:voff,len:h.len,little:true};
      if(h.g===0x0002&&h.e===0x0010){ tsUID=readString(u8,voff,h.len); }
      pos=voff+h.len;
      if(h.len===0xFFFFFFFF) break;
    }
  }

  // sem preâmbulo/File Meta: se os bytes 4–5 forem letras (um VR), é Explícito; senão, Implícito
  let guessImplicit=false;
  if(!hasPreamble){ const A=c=>c>=65&&c<=90; guessImplicit=!(A(u8[4])&&A(u8[5])); }
  const tsInfo = (tsUID&&TS[tsUID]) ? TS[tsUID]
    : {implicit:guessImplicit, little:true,
       name:tsUID||(guessImplicit?"Implicit VR Little Endian (sem preâmbulo)":"Explicit VR Little Endian (presumido)")};
  const compressedName = tsUID && COMPRESSED_TS[tsUID];
  const implicit=tsInfo.implicit, little=tsInfo.little;

  // Sequência de comprimento indefinido. Itens e delimitadores (grupo FFFE) têm sempre
  // cabeçalho de 8 bytes; os elementos dentro dos itens seguem o VR do dataset.
  function skipSeq(p){
    while(p+8<=u8.length){
      const g=dv.getUint16(p,little), e=dv.getUint16(p+2,little), len=dv.getUint32(p+4,little); p+=8;
      if(g===0xFFFE&&e===0xE0DD) return p;                       // fim da sequência
      if(g===0xFFFE&&e===0xE000){ p = len===0xFFFFFFFF ? skipItem(p) : p+len; }
      else return u8.length;                                     // estrutura inesperada: para com segurança
    }
    return p;
  }
  function skipItem(p){
    while(p+8<=u8.length){
      const g=dv.getUint16(p,little), e=dv.getUint16(p+2,little);
      if(g===0xFFFE){ const len=dv.getUint32(p+4,little); p+=8; if(e===0xE00D) return p; p+= len===0xFFFFFFFF?0:len; continue; }
      const h=readElementHeader(p,implicit,little); p+=h.hlen;
      p = h.len===0xFFFFFFFF ? skipSeq(p) : p+h.len;
    }
    return p;
  }

  let pixel={off:0,len:0,encapsulated:false,present:false};
  let compressed = !!compressedName || !!tsInfo.deflated;

  // --- Dataset principal ---
  // Nas sintaxes comprimidas o cabeçalho continua em VR Explícito LE (só o pixel é
  // encapsulado), então os metadados são lidos normalmente. Só o "deflated" não é lido.
  if(!tsInfo.deflated){
    while(pos+8<=u8.length){
      let h;
      try{ h=readElementHeader(pos,implicit,little); }catch(_){ break; }
      const voff=pos+h.hlen;
      if(h.g===0x7FE0 && h.e===0x0010){
        if(h.len===0xFFFFFFFF){ pixel={off:voff,len:u8.length-voff,encapsulated:true,present:true}; compressed=true; }
        else pixel={off:voff,len:h.len,encapsulated:false,present:true};
        break; // pixel data é o último elemento de que precisamos
      }
      if(h.len===0xFFFFFFFF){ pos=skipSeq(voff); continue; }
      if(!implicit && h.vr==="SQ"){ pos=voff+h.len; continue; }
      tags[tagKey(h.g,h.e)]={vr:h.vr,off:voff,len:h.len,little};
      pos=voff+h.len;
      if(voff+h.len>u8.length) break;
    }
  }

  // ---- extrai tags de interesse ----
  const T=(g,e)=>tags[tagKey(g,e)];
  const S=(g,e)=>{ const t=T(g,e); return t?readString(u8,t.off,t.len):null; };
  const N=(g,e)=>{ const v=S(g,e); if(v==null||v==="") return null; const n=parseFloat(v); return isNaN(n)?null:n; };
  const US=(g,e)=>{ const t=T(g,e); if(!t) return null; return t.little?dv.getUint16(t.off,true):dv.getUint16(t.off,false); };
  const MULTI=(g,e)=>{ const v=S(g,e); return v==null?null:v.split("\\").map(x=>parseFloat(x)).filter(x=>!isNaN(x)); };

  const meta={
    transferSyntax: tsUID, isVideo: isVideoTS(tsUID),
    transferSyntaxName: (compressedName?(isVideoTS(tsUID)?compressedName:compressedName+" (comprimido)"):tsInfo.name),
    little, implicit, compressed, compressedReason: compressedName||(tsInfo.deflated?"Deflated dataset":null),
    rows:US(0x0028,0x0010), cols:US(0x0028,0x0011),
    bitsAllocated:US(0x0028,0x0100)||16, bitsStored:US(0x0028,0x0101)||16, highBit:US(0x0028,0x0102),
    pixelRep:US(0x0028,0x0103)||0, samplesPerPixel:US(0x0028,0x0002)||1,
    photometric:(S(0x0028,0x0004)||"MONOCHROME2").trim(), planar:US(0x0028,0x0006)||0,
    numberOfFrames: parseInt(S(0x0028,0x0008)||"1",10)||1,
    rescaleSlope: (N(0x0028,0x1053)!=null?N(0x0028,0x1053):1),
    rescaleIntercept:(N(0x0028,0x1052)!=null?N(0x0028,0x1052):0),
    windowCenter: firstNum(MULTI(0x0028,0x1050)),
    windowWidth: firstNum(MULTI(0x0028,0x1051)),
    pixelSpacing: MULTI(0x0028,0x0030),               // [linha, coluna] mm
    sliceThickness: N(0x0018,0x0050),
    spacingBetween: N(0x0018,0x0088),
    ipp: MULTI(0x0020,0x0032),                        // ImagePositionPatient
    iop: MULTI(0x0020,0x0037),                        // ImageOrientationPatient
    instanceNumber: parseInt(S(0x0020,0x0013)||"0",10)||0,
    sliceLocation: N(0x0020,0x1041),
    studyUID:S(0x0020,0x000D), seriesUID:S(0x0020,0x000E), sopUID:S(0x0008,0x0018),
    modality:(S(0x0008,0x0060)||"").trim(),
    seriesNumber: parseInt(S(0x0020,0x0011)||"0",10)||0,
    seriesDesc:(S(0x0008,0x103E)||"").trim(),
    studyDesc:(S(0x0008,0x1030)||"").trim(),
    studyDate:(S(0x0008,0x0020)||"").trim(),
    bodyPart:(S(0x0018,0x0015)||"").trim(),
    patientName:(S(0x0010,0x0010)||"").trim(),
    patientID:(S(0x0010,0x0020)||"").trim(),
    patientBirth:(S(0x0010,0x0030)||"").trim(),
    patientSex:(S(0x0010,0x0040)||"").trim(),
    manufacturer:(S(0x0008,0x0070)||"").trim(),
    institution:(S(0x0008,0x0080)||"").trim(),
    referringPhysician:(S(0x0008,0x0090)||"").replace(/\^/g," ").trim(),
    accession:(S(0x0008,0x0050)||"").trim(),
    studyTime:(S(0x0008,0x0030)||"").trim(),
    stationName:(S(0x0008,0x1010)||"").trim(),
    pixel, pixelOffset:pixel.off, pixelLength:pixel.len,
  };
  if(meta.highBit==null) meta.highBit=meta.bitsStored-1;
  return meta;
}

function firstNum(arr){ return (arr&&arr.length)?arr[0]:null; }
function tagKey(g,e){ return (g.toString(16).padStart(4,"0")+e.toString(16).padStart(4,"0")); }
function readString(u8,off,len){
  if(off+len>u8.length) len=Math.max(0,u8.length-off);
  let s=""; for(let i=0;i<len;i++){ const c=u8[off+i]; if(c===0) break; s+=String.fromCharCode(c); }
  return s.replace(/\s+$/,"").trim();
}
/* =====================================================================
   EXTRAÇÃO E RENDERIZAÇÃO DE PIXELS DICOM
   ===================================================================== */
// retorna valores de modalidade (HU p/ TC) de um frame monocromático,
// ou RGBA direto para imagens coloridas.
function extractModality(meta, buffer, frameIndex=0){
  const {rows,cols,bitsAllocated,pixelRep,samplesPerPixel,photometric,planar,
         rescaleSlope,rescaleIntercept,pixel,little}=meta;
  if(!pixel||!pixel.present||meta.compressed) return null;
  const w=cols,h=rows; if(!w||!h) return null;
  const bytesPP=bitsAllocated/8;
  const frameSize=w*h*samplesPerPixel*bytesPP;
  const base=pixel.off + frameIndex*frameSize;
  if(base+frameSize>buffer.byteLength) return null;
  const dv=new DataView(buffer);

  if(samplesPerPixel>=3){ // COR (RGB/YBR tratado como RGB)
    if(bitsAllocated!==8) return null;
    const rgba=new Uint8ClampedArray(w*h*4);
    for(let i=0;i<w*h;i++){
      let r,g,b;
      if(planar===0){ const o=base+i*3; r=dv.getUint8(o); g=dv.getUint8(o+1); b=dv.getUint8(o+2); }
      else{ const pl=w*h; r=dv.getUint8(base+i); g=dv.getUint8(base+pl+i); b=dv.getUint8(base+2*pl+i); }
      rgba[i*4]=r; rgba[i*4+1]=g; rgba[i*4+2]=b; rgba[i*4+3]=255;
    }
    return {color:true,width:w,height:h,rgba};
  }

  if(bitsAllocated!==8 && bitsAllocated!==16) return null; // 1 ou 32 bits: fora do escopo desta edição
  const values=new Float32Array(w*h);
  let min=Infinity,max=-Infinity;
  const signed=pixelRep===1;
  // Bits Stored < Bits Allocated (ex.: TC de 12 bits em 16): mascara bits extras e estende o sinal
  const bs=clamp(meta.bitsStored||bitsAllocated,1,bitsAllocated);
  const mask=(1<<bs)-1, signBit=1<<(bs-1), range=1<<bs;
  for(let i=0;i<w*h;i++){
    let r = bitsAllocated===8 ? dv.getUint8(base+i) : dv.getUint16(base+i*2,little);
    r &= mask;
    if(signed && (r & signBit)) r -= range;
    const v=r*rescaleSlope+rescaleIntercept;
    values[i]=v; if(v<min)min=v; if(v>max)max=v;
  }
  return {color:false,width:w,height:h,values,min,max,
          mono1:photometric==="MONOCHROME1"};
}

// janela linear DICOM aplicada a um array de valores -> ImageData
function windowToImageData(frame, ww, wl, invert){
  const {width,height}=frame;
  const out=new ImageData(width,height);
  const d=out.data;
  if(frame.color){
    d.set(frame.rgba);
    if(invert){ for(let i=0;i<d.length;i+=4){ d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; } }
    return out;
  }
  const v=frame.values;
  ww=Math.max(1,ww);
  const lo=wl-0.5-(ww-1)/2, span=(ww-1);
  const inv = invert !== frame.mono1 ? true : false; // MONOCHROME1 inverte por padrão
  for(let i=0;i<v.length;i++){
    let g;
    const x=v[i];
    if(x<=lo) g=0; else if(x> lo+span) g=255; else g=((x-(wl-0.5))/span+0.5)*255;
    if(inv) g=255-g;
    const j=i*4; d[j]=d[j+1]=d[j+2]=g; d[j+3]=255;
  }
  return out;
}

// janela sugerida (WC/WW do DICOM, senão a partir dos dados)
function suggestWindow(meta,frame){
  if(meta && meta.windowWidth && meta.windowCenter!=null)
    return {ww:meta.windowWidth, wl:meta.windowCenter};
  if(frame && !frame.color && isFinite(frame.min) && isFinite(frame.max)){
    const ww=Math.max(1,frame.max-frame.min); return {ww, wl:(frame.max+frame.min)/2};
  }
  return {ww:1500, wl:300};
}

// desenha um frame (mono+janela OU cor) para um canvas offscreen e retorna-o
function frameToCanvas(frame, ww, wl, invert){
  const c=document.createElement("canvas"); c.width=frame.width; c.height=frame.height;
  const ctx=c.getContext("2d");
  ctx.putImageData(windowToImageData(frame,ww,wl,invert),0,0);
  return c;
}

/* =====================================================================
   HIERARQUIA: Estudo -> Série -> Instância
   ===================================================================== */
function kindFromFile(name,mime){
  const ext=(name.split(".").pop()||"").toLowerCase();
  if(mime&&mime.startsWith("video/")) return "video";
  if(["mp4","webm","mov","m4v","ogv","avi"].includes(ext)) return "video";
  if(mime==="application/pdf"||ext==="pdf") return "pdf";
  if(mime&&mime.startsWith("image/")) return "image";
  if(["png","jpg","jpeg","gif","bmp","webp","tif","tiff"].includes(ext)) return "image";
  if(ext==="dcm"||ext==="dicom"||ext==="ima") return "dicom";
  return "other";
}

function buildHierarchy(){
  APP.volumes={};   // a composição das séries pode ter mudado (nova importação): descarta volumes em cache
  const studies=new Map();
  function study(uid,desc,date,mod){
    if(!studies.has(uid)) studies.set(uid,{uid,desc:desc||"",date:date||"",modality:mod||"",series:new Map()});
    const s=studies.get(uid); if(desc&&!s.desc)s.desc=desc; if(date&&!s.date)s.date=date; if(mod&&!s.modality)s.modality=mod;
    return s;
  }
  for(const f of APP.files){
    // só DICOM com pixel vira série visível; DICOMDIR, laudos estruturados etc.
    // ficam no Arquivo completo e no backup como "outros"
    if(f.kind==="dicom"&&f.meta&&f.meta.pixel&&f.meta.pixel.present&&!f.meta.isVideo){
      const m=f.meta;
      const st=study(m.studyUID||"ESTUDO-UNICO", m.studyDesc, m.studyDate, m.modality);
      const sk=m.seriesUID||("serie-"+(m.seriesNumber||0));
      if(!st.series.has(sk)) st.series.set(sk,{id:"S_"+hashStr(st.uid+"|"+sk),uid:sk,number:m.seriesNumber,
        desc:m.seriesDesc||("Série "+(m.seriesNumber||"")),modality:m.modality,kind:"dicom",instances:[]});
      st.series.get(sk).instances.push(f);
    }else if(f.kind==="image"){
      const st=study("MIDIA-IMPORTADA","Imagens e mídia importadas","","");
      const grp=f.folder||"Imagens";
      const sk="img::"+grp;
      if(!st.series.has(sk)) st.series.set(sk,{id:"S_"+hashStr(sk),uid:sk,number:0,desc:grp,modality:"IMG",kind:"image",instances:[]});
      st.series.get(sk).instances.push(f);
    }
  }
  // ordena instâncias DICOM por posição/instância e marca volumes
  const out=[];
  for(const st of studies.values()){
    const sArr=[];
    for(const s of st.series.values()){
      if(s.kind==="dicom") sortDicomInstances(s);
      else s.instances.sort((a,b)=>(a.name||"").localeCompare(b.name||"",undefined,{numeric:true}));
      s.isVolume = s.kind==="dicom" && detectVolume(s);
      // lista navegável: cada quadro de um DICOM multi-frame vira uma posição própria
      s.frames=[];
      for(const f of s.instances){
        const n=(f.meta&&!f.meta.compressed&&f.meta.numberOfFrames>1)?f.meta.numberOfFrames:1;
        for(let k=0;k<n;k++) s.frames.push({f,k});
      }
      sArr.push(s);
    }
    sArr.sort((a,b)=>(a.number||0)-(b.number||0));
    out.push({...st,series:sArr});
  }
  out.sort((a,b)=>(a.uid==="MIDIA-IMPORTADA"?1:0)-(b.uid==="MIDIA-IMPORTADA"?1:0));
  APP.studies=out;
}

function sortDicomInstances(s){
  // normal do plano = produto vetorial das direções (IOP)
  const iop=s.instances[0]&&s.instances[0].meta.iop;
  let normal=null;
  if(iop&&iop.length===6){ normal=[iop[1]*iop[5]-iop[2]*iop[4], iop[2]*iop[3]-iop[0]*iop[5], iop[0]*iop[4]-iop[1]*iop[3]]; }
  s.instances.forEach(f=>{
    const ipp=f.meta.ipp;
    f._pos = (normal&&ipp&&ipp.length===3) ? (ipp[0]*normal[0]+ipp[1]*normal[1]+ipp[2]*normal[2])
            : (f.meta.sliceLocation!=null?f.meta.sliceLocation:f.meta.instanceNumber);
  });
  s.instances.sort((a,b)=> (a._pos-b._pos) || (a.meta.instanceNumber-b.meta.instanceNumber));
}

// volume válido p/ MPR/MIP: muitos cortes, mesmas dimensões, espaçamento ~uniforme, mesma orientação
function detectVolume(s){
  const inst=s.instances; if(inst.length<8) return false;
  const m0=inst[0].meta;
  if(!m0.rows||!m0.cols||m0.compressed) return false;
  if(m0.samplesPerPixel>1) return false;
  for(const f of inst){ if(f.meta.rows!==m0.rows||f.meta.cols!==m0.cols||f.meta.compressed) return false; }
  if(!m0.iop||m0.iop.length!==6) return false;
  // espaçamento consistente
  const gaps=[]; for(let i=1;i<inst.length;i++) gaps.push(Math.abs(inst[i]._pos-inst[i-1]._pos));
  const valid=gaps.filter(g=>g>0.01);
  if(valid.length<inst.length*0.6) return false;
  const avg=valid.reduce((a,b)=>a+b,0)/valid.length;
  if(!(avg>0)) return false;
  const okUniform=valid.every(g=>Math.abs(g-avg)<avg*0.5);
  s._sliceSpacing=avg;
  return okUniform;
}

function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }

/* ---------- SIDEBAR: lista de séries ---------- */
function renderSeriesList(){
  const box=$("#seriesList"); box.innerHTML="";
  if(!APP.studies.length){
    box.innerHTML='<div class="empty-note">Nenhuma série carregada ainda.<br><br>Abra <b>Importar</b> para adicionar os arquivos do seu exame.</div>';
    return;
  }
  for(const st of APP.studies){
    const head=el("div",{class:"sb-head",style:"border-bottom:0;padding:10px 10px 4px"},
      el("h3",{text: st.uid==="MIDIA-IMPORTADA" ? "Imagens" : (st.desc||"Estudo")+(st.date?" · "+fmtDicomDate(st.date):"") }));
    box.append(head);
    for(const s of st.series){
      const card=el("div",{class:"series-card",onclick:()=>selectSeries(s)});
      card.dataset.sid=s.id;
      const img=el("img",{class:"thumb",alt:""});
      makeSeriesThumb(s).then(u=>{ if(u) img.src=u; });
      const badges=el("div",{class:"badges"});
      badges.append(el("span",{class:"tag "+(s.kind==="dicom"?"dcm":s.kind==="image"?"img":""),text:s.kind==="dicom"?(s.modality||"DICOM"):"IMG"}));
      badges.append(el("span",{class:"tag",text:s.frames.length+(s.frames.length===1?" img":" imgs")}));
      if(s.isVolume) badges.append(el("span",{class:"tag vol",text:"3D"}));
      card.append(img, el("div",{class:"meta"},
        el("div",{class:"t",text:s.desc||"Série"}),
        el("div",{class:"s",text:(s.modality||"")+(s.number?(" · nº "+s.number):"")}),
        badges));
      box.append(card);
    }
  }
  // marca ativa
  if(APP.current.series){ const c=box.querySelector('[data-sid="'+APP.current.series.id+'"]'); if(c)c.classList.add("active"); }
}
function fmtDicomDate(d){ if(/^\d{8}$/.test(d)) return d.slice(6,8)+"/"+d.slice(4,6)+"/"+d.slice(0,4); return d; }

async function makeSeriesThumb(s){
  try{
    const mid=s.instances[Math.floor(s.instances.length/2)];
    if(s.kind==="image"){ return await thumbForImageFile(mid); }
    const buf=await getBuf(mid.id); if(!buf) return null;
    const frame=extractModality(mid.meta,buf,0); if(!frame) return null;
    const win=suggestWindow(mid.meta,frame);
    const c=frameToCanvas(frame,win.ww,win.wl,false);
    const t=downscale(c,96); return t.toDataURL("image/jpeg",0.7);
  }catch(e){ return null; }
}
async function thumbForImageFile(f){
  try{ const buf=await getBuf(f.id); const blob=new Blob([buf],{type:f.type||"image/*"});
    const bmp=await createImageBitmap(blob); const c=downscaleBitmap(bmp,96); return c.toDataURL("image/jpeg",0.7);
  }catch(e){ return null; }
}
function downscale(src,max){ const r=Math.min(1,max/Math.max(src.width,src.height)); const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(src.width*r)); c.height=Math.max(1,Math.round(src.height*r));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height); return c; }
function downscaleBitmap(bmp,max){ const r=Math.min(1,max/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(bmp.width*r)); c.height=Math.max(1,Math.round(bmp.height*r));
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return c; }

/* =====================================================================
   VISUALIZADOR — seleção, carregamento e renderização no canvas
   ===================================================================== */
const V={ frameCanvas:null, fit:1, matrix:null, imgBitmap:null };

async function selectSeries(s){
  stopCine();
  APP.current.series=s; APP.current.index=Math.floor(s.frames.length/2);
  APP.current.fresh=true;   // nova série: aplica janela sugerida e reseta zoom/pan uma única vez
  $$("#seriesList .series-card").forEach(c=>c.classList.toggle("active",c.dataset.sid===s.id));
  setView("viewer");
  buildToolbar();
  renderSeriesMeta(s);
  await loadInstance(APP.current.index);   // loadInstance decide se mostra a imagem ou um aviso
}

async function loadInstance(i){
  const s=APP.current.series; if(!s) return;
  i=clamp(i,0,s.frames.length-1); APP.current.index=i;
  const {f,k}=s.frames[i];
  const fresh=APP.current.fresh; APP.current.fresh=false;
  const tok=APP.current.loadTok=(APP.current.loadTok||0)+1;
  const buf=await getBuf(f.id);
  if(tok!==APP.current.loadTok) return;   // rolagem rápida: uma leitura mais nova já assumiu
  APP.current.image=f; APP.current.frameNo=k;
  V.imgBitmap=null; V.frameCanvas=null; APP.current.frame=null;

  if(f.kind==="dicom"){
    if(f.meta.isVideo){
      showStageMsg("Vídeo","Disponível em Vídeos e imagens.");
      updateHUD(); syncSliceUI(); renderMeta(f);
      return;
    }
    if(f.meta.compressed){
      showStageMsg("Imagem comprimida",esc(f.meta.transferSyntaxName)+". Disponível para download em Arquivos do exame.");
      updateHUD(); syncSliceUI(); renderMeta(f);
      return;
    }
    const frame=extractModality(f.meta,buf,k);
    if(!frame){ showStageMsg("Imagem não exibível","Disponível para download em Arquivos do exame."); updateHUD(); syncSliceUI(); return; }
    APP.current.frame=frame;
    if(fresh){ // janela sugerida só ao abrir a série; depois, respeita o ajuste do usuário
      const win=suggestWindow(f.meta,frame);
      APP.view.ww=Math.round(win.ww); APP.view.wl=Math.round(win.wl);
      syncWindowUI();
    }
    V.frameCanvas=frameToCanvas(frame,APP.view.ww,APP.view.wl,APP.view.invert);
  }else if(f.kind==="image"){
    try{ const blob=new Blob([buf],{type:f.type||"image/*"}); const bmp=await createImageBitmap(blob);
      if(tok!==APP.current.loadTok) return;
      V.imgBitmap=bmp; const c=document.createElement("canvas"); c.width=V.imgBitmap.width; c.height=V.imgBitmap.height;
      c.getContext("2d").drawImage(V.imgBitmap,0,0); V.frameCanvas=c;
    }catch(e){ showStageMsg("Imagem não exibível","Disponível para download em Arquivos do exame.");
      updateHUD(); syncSliceUI(); return; }
  }
  $("#stageMsg").classList.add("hidden");
  if(fresh) resetViewTransform(true);
  drawViewer();
  updateHUD();
  renderMeta(f);
  renderMeasList();
  syncSliceUI();
}

function showStageMsg(title,html){
  V.frameCanvas=null; drawViewer();   // limpa a imagem anterior para não ficar "fantasma" atrás do aviso
  const m=$("#stageMsg"); m.classList.remove("hidden");
  m.querySelector(".box").innerHTML="<h2>"+esc(title)+"</h2><p>"+html+"</p>";
}

function resetViewTransform(keepWindow){
  APP.view.zoom=1; APP.view.panX=0; APP.view.panY=0; APP.view.rotate=0; APP.view.flipH=false; APP.view.flipV=false;
  if(!keepWindow){ APP.view.invert=false; }
}

function stageSize(){ const st=$("#stage"); return {w:st.clientWidth, h:st.clientHeight}; }

function drawViewer(){
  const fc=V.frameCanvas; const cv=$("#mainCanvas"), ov=$("#overlayCanvas");
  const {w:sw,h:sh}=stageSize(); const dpr=Math.min(window.devicePixelRatio||1,2);
  for(const c of [cv,ov]){ c.style.width=sw+"px"; c.style.height=sh+"px"; c.width=Math.round(sw*dpr); c.height=Math.round(sh*dpr); }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,sw,sh);
  if(!fc){ V.matrix=null; ov.getContext("2d").clearRect(0,0,ov.width,ov.height); return; }
  const fw=fc.width, fh=fc.height;
  V.fit=Math.min(sw/fw, sh/fh)*0.96;
  const s=V.fit*APP.view.zoom;
  const cx=sw/2+APP.view.panX, cy=sh/2+APP.view.panY;
  const m=new DOMMatrix().translate(cx,cy).rotate(APP.view.rotate)
        .scale((APP.view.flipH?-1:1)*s,(APP.view.flipV?-1:1)*s);
  V.matrix=m; V.fw=fw; V.fh=fh;
  ctx.imageSmoothingEnabled = APP.view.zoom<3;
  ctx.save(); ctx.setTransform(m.a*dpr,m.b*dpr,m.c*dpr,m.d*dpr,m.e*dpr,m.f*dpr);
  ctx.drawImage(fc,-fw/2,-fh/2,fw,fh); ctx.restore();
  drawOverlay();
}

// imagem(px) -> tela(css)
function imgToScreen(x,y){ const p=V.matrix.transformPoint(new DOMPoint(x-V.fw/2,y-V.fh/2)); return {x:p.x,y:p.y}; }
function screenToImg(x,y){ const inv=V.matrix.inverse(); const p=inv.transformPoint(new DOMPoint(x,y)); return {x:p.x+V.fw/2,y:p.y+V.fh/2}; }

/* ---------- medições: persistência + helpers ---------- */
// medições são guardadas por imagem E quadro (multi-frame tem medições independentes por quadro)
function measKey(){ const f=APP.current.image; if(!f)return null; const k=APP.current.frameNo||0; return k?(f.id+"#"+k):f.id; }
function getMeas(){ const id=measKey(); if(!id)return[]; return APP.measurements[id]||(APP.measurements[id]=[]); }
async function persistMeas(){ try{ await idbPut("meta",APP.measurements,"measurements"); }catch(e){} }
function clearMeas(){ const id=measKey(); if(!id)return; APP.measurements[id]=[]; persistMeas(); drawOverlay(); renderMeasList(); }
function addMeas(mo){ getMeas().push(mo); persistMeas(); drawOverlay(); renderMeasList(); }

function pxMM(){ const m=APP.current.image&&APP.current.image.meta; if(m&&m.pixelSpacing&&m.pixelSpacing.length>=2) return {row:m.pixelSpacing[0],col:m.pixelSpacing[1]}; return null; }
function lengthLabel(p1,p2){
  const mm=pxMM(); const dx=p2.x-p1.x, dy=p2.y-p1.y;
  if(mm){ const d=Math.sqrt((dx*mm.col)**2+(dy*mm.row)**2); return d.toFixed(1)+" mm"; }
  return Math.sqrt(dx*dx+dy*dy).toFixed(0)+" px";
}
function angleLabel(a,b,c){ // ângulo no vértice b
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  let ang=Math.abs(Math.atan2(v1.x*v2.y-v1.y*v2.x, v1.x*v2.x+v1.y*v2.y)*180/Math.PI);
  if(ang>180)ang=360-ang; return ang.toFixed(1)+"°";
}
function roiStats(type,p1,p2){
  const fr=APP.current.frame; const mm=pxMM();
  let x0=Math.min(p1.x,p2.x),x1=Math.max(p1.x,p2.x),y0=Math.min(p1.y,p2.y),y1=Math.max(p1.y,p2.y);
  x0=clamp(Math.round(x0),0,(fr?fr.width:1)-1); x1=clamp(Math.round(x1),0,(fr?fr.width:1)-1);
  y0=clamp(Math.round(y0),0,(fr?fr.height:1)-1); y1=clamp(Math.round(y1),0,(fr?fr.height:1)-1);
  const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=(x1-x0)/2||1, ry=(y1-y0)/2||1;
  let n=0,sum=0,min=Infinity,max=-Infinity;
  if(fr&&!fr.color){
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(type==="ellipse"){ const nx=(x-cx)/rx, ny=(y-cy)/ry; if(nx*nx+ny*ny>1) continue; }
      const v=fr.values[y*fr.width+x]; n++; sum+=v; if(v<min)min=v; if(v>max)max=v;
    }
  }
  const areaPx=(type==="ellipse")?(Math.PI*rx*ry):((x1-x0)*(y1-y0));
  let area; if(mm){ area=(type==="ellipse"?Math.PI*rx*mm.col*ry*mm.row:(x1-x0)*mm.col*(y1-y0)*mm.row); area=(area/100).toFixed(2)+" cm²"; }
  else area=Math.round(areaPx)+" px²";
  const unit=(fr&&!fr.color&&APP.current.image.kind==="dicom")?" HU":"";
  const mean=n?(sum/n):0;
  return {text:(n?("μ "+mean.toFixed(0)+unit+"  ·  "+area):area), detail:n?("min "+min.toFixed(0)+" / max "+max.toFixed(0)+unit):""};
}

/* ---------- desenho da sobreposição (medições) ---------- */
function drawOverlay(){
  const ov=$("#overlayCanvas"); if(!ov) return; const dpr=Math.min(window.devicePixelRatio||1,2);
  const ctx=ov.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,ov.width,ov.height);
  if(!V.matrix) return;
  const list=getMeas().slice(); if(V.draft) list.push(V.draft);
  ctx.lineWidth=1.4; ctx.font="12px var(--mono),monospace";
  for(const m of list){
    ctx.strokeStyle=m.color||"#58D7D1"; ctx.fillStyle=m.color||"#58D7D1";
    const P=m.pts.map(p=>imgToScreen(p.x,p.y));
    if(m.type==="length"&&P.length>=2){
      line(ctx,P[0],P[1]); handle(ctx,P[0]); handle(ctx,P[1]);
      label(ctx,mid(P[0],P[1]),lengthLabel(m.pts[0],m.pts[1]));
    }else if(m.type==="angle"&&P.length>=2){
      line(ctx,P[1],P[0]); if(P[2]) line(ctx,P[1],P[2]); P.forEach(p=>handle(ctx,p));
      if(P.length>=3) label(ctx,P[1],angleLabel(m.pts[0],m.pts[1],m.pts[2]));
    }else if((m.type==="rect"||m.type==="ellipse")&&P.length>=2){
      drawROI(ctx,m.type,m.pts[0],m.pts[1]);
      const st=roiStats(m.type,m.pts[0],m.pts[1]);
      label(ctx,imgToScreen(Math.min(m.pts[0].x,m.pts[1].x),Math.min(m.pts[0].y,m.pts[1].y)),st.text,st.detail);
    }else if(m.type==="probe"&&P.length>=1){
      handle(ctx,P[0]); label(ctx,P[0],m.txt||"");
    }
  }
}
function line(ctx,a,b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function handle(ctx,p){ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.stroke(); }
function mid(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
function label(ctx,p,txt,det){ if(!txt)return; ctx.save(); const pad=4; ctx.font="12px monospace";
  const w=Math.max(ctx.measureText(txt).width, det?ctx.measureText(det).width:0)+pad*2;
  const h=det?30:16; ctx.fillStyle="rgba(5,10,16,.8)"; ctx.fillRect(p.x+6,p.y-h-2,w,h);
  ctx.fillStyle="#cdeef0"; ctx.fillText(txt,p.x+6+pad,p.y-h+10);
  if(det){ ctx.fillStyle="#8fb7bb"; ctx.fillText(det,p.x+6+pad,p.y-h+24); } ctx.restore(); }
function drawROI(ctx,type,a,b){
  if(type==="rect"){ const c=[{x:a.x,y:a.y},{x:b.x,y:a.y},{x:b.x,y:b.y},{x:a.x,y:b.y}].map(p=>imgToScreen(p.x,p.y));
    ctx.beginPath(); ctx.moveTo(c[0].x,c[0].y); for(let i=1;i<4;i++)ctx.lineTo(c[i].x,c[i].y); ctx.closePath(); ctx.stroke(); }
  else{ const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,rx=Math.abs(b.x-a.x)/2,ry=Math.abs(b.y-a.y)/2;
    ctx.beginPath(); for(let i=0;i<=48;i++){ const t=i/48*2*Math.PI; const p=imgToScreen(cx+rx*Math.cos(t),cy+ry*Math.sin(t)); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);} ctx.closePath(); ctx.stroke(); }
}

/* =====================================================================
   INTERAÇÃO: ponteiro, roda, cine, teclado, controles
   ===================================================================== */
function relPos(ev){ const r=$("#stage").getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; }

function initViewerInteraction(){
  const stage=$("#stage");
  let drag=null, angleState=null;
  // gesto de pinça (dois dedos) para zoom em tablets/celulares
  const touches=new Map(); let pinch=null;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

  stage.addEventListener("pointerdown",ev=>{
    if(!V.frameCanvas||!V.matrix) return; stage.setPointerCapture(ev.pointerId);
    const p=relPos(ev);
    if(ev.pointerType==="touch"){
      touches.set(ev.pointerId,p);
      if(touches.size===2){ const [a,b]=[...touches.values()]; pinch={d:Math.max(1,dist(a,b)),z:APP.view.zoom}; drag=null; V.draft=null; drawOverlay(); return; }
    }
    const ip=screenToImg(p.x,p.y);
    const t=APP.tool;
    if(t==="wwwl") drag={t,sx:p.x,sy:p.y,ww:APP.view.ww,wl:APP.view.wl};
    else if(t==="pan") drag={t,sx:p.x,sy:p.y,px:APP.view.panX,py:APP.view.panY};
    else if(t==="zoom") drag={t,sy:p.y,z:APP.view.zoom};
    else if(t==="length"){ V.draft={type:"length",pts:[ip,{...ip}],color:"#58D7D1"}; drag={t}; }
    else if(t==="rect"){ V.draft={type:"rect",pts:[ip,{...ip}],color:"#4F9CF9"}; drag={t}; }
    else if(t==="ellipse"){ V.draft={type:"ellipse",pts:[ip,{...ip}],color:"#5AD19A"}; drag={t}; }
    else if(t==="probe"){ drag={t}; updateProbe(ip); }
    else if(t==="angle"){
      if(!angleState){ angleState=[ip]; V.draft={type:"angle",pts:[ip,{...ip}],color:"#F2B84B"}; }
      else if(angleState.length===1){ angleState.push(ip); V.draft={type:"angle",pts:[angleState[0],ip,{...ip}],color:"#F2B84B"}; }
      else { angleState.push(ip); addMeas({type:"angle",pts:angleState.slice(),color:"#F2B84B"}); angleState=null; V.draft=null; }
      drawOverlay(); return;
    }
    drawOverlay();
  });

  stage.addEventListener("pointermove",ev=>{
    if(!V.matrix) return;   // nenhuma imagem carregada ainda
    const p=relPos(ev);
    if(touches.has(ev.pointerId)) touches.set(ev.pointerId,p);
    if(pinch&&touches.size===2){ const [a,b]=[...touches.values()];
      APP.view.zoom=clamp(pinch.z*dist(a,b)/pinch.d,0.1,20); drawViewer(); updateHUD(); return; }
    const ip=screenToImg(p.x,p.y);
    if(APP.tool==="angle"&&angleState){
      if(angleState.length===1) V.draft.pts[1]=ip; else if(angleState.length===2) V.draft.pts[2]=ip;
      drawOverlay(); return;
    }
    if(!drag) return;
    const t=drag.t;
    if(t==="wwwl"){ applyWindow(Math.max(1,drag.ww+(p.x-drag.sx)*2), drag.wl+(p.y-drag.sy)*2); }
    else if(t==="pan"){ APP.view.panX=drag.px+(p.x-drag.sx); APP.view.panY=drag.py+(p.y-drag.sy); drawViewer(); updateHUD(); }
    else if(t==="zoom"){ APP.view.zoom=clamp(drag.z*(1+(drag.sy-p.y)/200),0.1,20); drawViewer(); updateHUD(); }
    else if(t==="length"||t==="rect"||t==="ellipse"){ V.draft.pts[1]=ip; drawOverlay(); }
    else if(t==="probe"){ updateProbe(ip); }
  });

  const endTouch=ev=>{ touches.delete(ev.pointerId); if(touches.size<2) pinch=null; };
  stage.addEventListener("pointercancel",ev=>{ endTouch(ev); drag=null; if(V.draft&&APP.tool!=="angle"){V.draft=null;drawOverlay();} });
  stage.addEventListener("pointerup",ev=>{
    endTouch(ev);
    if(drag&&V.draft&&["length","rect","ellipse"].includes(drag.t)){
      const a=V.draft.pts[0],b=V.draft.pts[1];
      if(Math.hypot(b.x-a.x,b.y-a.y)>2) addMeas(V.draft);
      V.draft=null; drawOverlay();
    }
    if(drag&&drag.t==="probe"&&V.draft){ addMeas(V.draft); V.draft=null; drawOverlay(); }
    drag=null;
  });

  stage.addEventListener("wheel",ev=>{
    if(!V.frameCanvas) return; ev.preventDefault();
    if(ev.ctrlKey||ev.metaKey){ APP.view.zoom=clamp(APP.view.zoom*(ev.deltaY<0?1.12:1/1.12),0.1,20); drawViewer(); updateHUD(); }
    else { step(ev.deltaY>0?1:-1); }
  },{passive:false});

  function updateProbe(ip){
    const fr=APP.current.frame; const x=Math.round(ip.x),y=Math.round(ip.y);
    if(!fr||x<0||y<0||x>=fr.width||y>=fr.height){ V.draft=null; drawOverlay(); return; }
    let txt;
    if(fr.color){ txt="("+x+","+y+")"; }
    else{ const v=fr.values[y*fr.width+x]; const unit=APP.current.image.kind==="dicom"?" HU":""; txt=v.toFixed(0)+unit+"  ("+x+","+y+")"; }
    V.draft={type:"probe",pts:[ip],txt,color:"#F26A6A"}; drawOverlay();
  }
}

/* ---------- navegação por cortes ---------- */
function step(d){ const s=APP.current.series; if(!s)return; loadInstance(clamp(APP.current.index+d,0,s.frames.length-1)); }
function goto(i){ loadInstance(i); }

/* ---------- cine ---------- */
function playCine(){ const s=APP.current.series; if(!s||s.frames.length<2)return;
  stopCine(); APP.cine.playing=true; $("#btnPlay").innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  // honestidade: percorrer cortes é uma reprodução gerada aqui, não um vídeo fornecido pelo hospital
  $("#cineFps").textContent=APP.cine.fps+" fps";
  APP.cine.timer=setInterval(()=>{
    let n=APP.current.index+1;
    if(n>=s.frames.length){ if(APP.cine.loop)n=0; else return stopCine(); }
    loadInstance(n);
  }, 1000/APP.cine.fps);
}
function stopCine(){ APP.cine.playing=false; if(APP.cine.timer)clearInterval(APP.cine.timer); APP.cine.timer=null;
  $("#cineFps").textContent="";
  $("#btnPlay").innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; }
function toggleCine(){ APP.cine.playing?stopCine():playCine(); }

  $("#btnPlay").onclick=toggleCine;

  $("#loopChk").addEventListener("change",e=>APP.cine.loop=e.target.checked);
  $("#wwRange").addEventListener("input",e=>applyWindow(parseInt(e.target.value,10),APP.view.wl));
  $("#wlRange").addEventListener("input",e=>applyWindow(APP.view.ww,parseInt(e.target.value,10)));
  $$(".insp-sec > h4").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("closed")));
  // presets no inspector
  const pg=$("#presetGrid"); WINDOW_PRESETS.forEach(p=>pg.append(el("button",{text:p.name,onclick:()=>applyWindow(p.ww,p.wl)})));

  // teclado
  window.addEventListener("keydown",ev=>{
    if($("#modal").classList.contains("open")) { if(ev.key==="Escape")closeModal(); return; }
    if(!APP.current.series) return;
    // não captura teclas enquanto o foco está num controle (slider, select, campo)
    const tg=ev.target&&ev.target.tagName; if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA") return;
    // atalhos do visualizador só valem quando ele está aberto
    if(!$("#view-viewer").classList.contains("active")) return;
    const k=ev.key;
    if(k==="ArrowDown"||k==="ArrowRight"){ step(1); ev.preventDefault(); }
    else if(k==="ArrowUp"||k==="ArrowLeft"){ step(-1); ev.preventDefault(); }
    else if(k===" "){ toggleCine(); ev.preventDefault(); }
    else if(k==="f"){ resetViewTransform(true); drawViewer(); updateHUD(); }
    else if(k==="r"){ APP.view.rotate=(APP.view.rotate+90)%360; drawViewer(); }
    else if(k==="i"){ APP.view.invert=!APP.view.invert; refreshFrameRender(); }
    else if(k==="Home"){ goto(0); } else if(k==="End"){ const s=APP.current.series; goto(s.frames.length-1); }
    else if(k>="1"&&k<="8"){ const t=TOOLS[parseInt(k,10)-1]; if(t)setTool(t.id); }
  });

  // redesenho ao redimensionar
  let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(V.frameCanvas)drawViewer(); },120); });
  $("#btnReloadSeries").onclick=()=>{ buildHierarchy(); renderSeriesList(); toast("Lista atualizada"); };
}

/* =====================================================================
   IMPORTAÇÃO — leitura, classificação, hash e gravação local
   ===================================================================== */
let IMPORTING=false;
function uid(){ try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return "f_"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

async function importFiles(fileList, progressCb){
  if(IMPORTING){ toast("Importação já em andamento…","warn"); return; }
  IMPORTING=true;
  const report={discovered:0, imported:0, duplicates:0, failed:0, dicom:0, images:0, videos:0, pdfs:0, others:0, compressedSeries:0, zips:0, bytes:0, items:[]};
  // pacotes .zip (como os baixados do portal) são abertos aqui mesmo, sem descompactar antes
  const files=[];
  for(const f of Array.from(fileList)){
    if(isZipFile(f)){
      progressCb&&progressCb(0,1,"abrindo "+f.name);
      try{ files.push(...await expandZip(f)); report.zips++; }
      catch(e){ report.failed++; report.items.push({name:f.name,status:"falha",error:String(e&&e.message||e)}); }
    } else files.push(f);
  }
  report.discovered=files.length+report.failed;
  const known=new Set(APP.files.map(f=>f.hash));
  let done=0;
  for(const file of files){
    try{
      const buf=await file.arrayBuffer();
      const u8=new Uint8Array(buf);
      const relPath=file.webkitRelativePath||file._path||file.name;
      const folder=relPath.includes("/")?relPath.split("/").slice(0,-1).join("/"):"";
      let kind=kindFromFile(file.name,file.type);
      if(kind==="other"||kind==="dicom"){ if(looksDicom(u8)) kind="dicom"; }
      const hash=await sha256Hex(buf);
      if(known.has(hash)){ report.duplicates++; report.items.push({name:file.name,status:"duplicado"}); done++; progressCb&&progressCb(done,files.length,file.name); continue; }
      known.add(hash);

      const rec={ id:uid(), name:file.name, folder, path:relPath, size:file.size, type:file.type||"",
        kind, hash, hashAlgo:"SHA-256", addedAt:new Date().toISOString(), meta:null, sourceZip:file._zip||null };

      if(kind==="dicom"){
        try{ rec.meta=parseDicom(buf);
          if(rec.meta.isVideo) report.videos++;
          else { if(rec.meta.compressed) report.compressedSeries++; report.dicom++; } }
        catch(e){ rec.kind="other"; rec.parseError=String(e&&e.message||e); report.others++; }
      } else if(kind==="image"){ report.images++; }
      else if(kind==="video"){ report.videos++; }
      else if(kind==="pdf"){ report.pdfs++; }
      else report.others++;

      await saveAsset(rec, buf);
      APP.files.push(rec);
      report.imported++; report.bytes+=file.size;
      report.items.push({name:file.name,status:"importado",kind:rec.kind,size:file.size});
    }catch(e){
      report.failed++; report.items.push({name:file.name,status:"falha",error:String(e&&e.message||e)});
    }
    done++; progressCb&&progressCb(done,files.length,file.name);
  }
  buildHierarchy();
  renderSeriesList();
  updateTopStatus();
  APP.report=report;
  IMPORTING=false;
  return report;
}

/* ---------- leitor de ZIP (sem bibliotecas: método STORE e DEFLATE nativo do navegador) ---------- */
function isZipFile(f){ return /\.zip$/i.test(f.name||"") || /(^|\/)(x-)?zip(-compressed)?$/i.test(f.type||""); }
async function expandZip(file){
  // diretório central: lido do fim do arquivo, sem carregar o .zip inteiro na memória
  const tailLen=Math.min(file.size,65535+22);
  const tail=new Uint8Array(await file.slice(file.size-tailLen).arrayBuffer());
  const tdv=new DataView(tail.buffer);
  let e=-1; for(let i=tail.length-22;i>=0;i--){ if(tdv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("não é um ZIP válido (diretório central ausente)");
  const count=tdv.getUint16(e+10,true), cdSize=tdv.getUint32(e+12,true), cdOff=tdv.getUint32(e+16,true);
  if(count===0xFFFF||cdSize===0xFFFFFFFF||cdOff===0xFFFFFFFF)
    throw new Error("ZIP64 (pacote acima de 4 GB): descompacte no computador e importe a pasta");
  const cd=new Uint8Array(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()); const dv=new DataView(cd.buffer);
  const base=(file.name||"pacote").replace(/\.zip$/i,"");
  const out=[]; let p=0;
  for(let k=0;k<count && p+46<=cd.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("diretório central do ZIP corrompido");
    const flags=dv.getUint16(p+8,true), method=dv.getUint16(p+10,true), crc=dv.getUint32(p+16,true),
          csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true), nlen=dv.getUint16(p+28,true),
          xlen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), loff=dv.getUint32(p+42,true);
    const name=new TextDecoder(flags&0x800?"utf-8":"windows-1252").decode(cd.subarray(p+46,p+46+nlen));
    p+=46+nlen+xlen+clen;
    // pastas e metadados do macOS (__MACOSX) não são arquivos do exame
    if(name.endsWith("/")||name.startsWith("__MACOSX/")) continue;
    out.push({ name:name.split("/").pop(), size:usize, type:"", _path:base+"/"+name, _zip:file.name,
      arrayBuffer: async()=>{
        if(flags&1) throw new Error("arquivo protegido por senha dentro do ZIP");
        const lh=new DataView(await file.slice(loff,loff+30).arrayBuffer());
        if(lh.getUint32(0,true)!==0x04034b50) throw new Error("cabeçalho local inválido no ZIP");
        const start=loff+30+lh.getUint16(26,true)+lh.getUint16(28,true);
        const raw=new Uint8Array(await file.slice(start,start+csize).arrayBuffer());
        let data;
        if(method===0) data=raw;
        else if(method===8){
          if(typeof DecompressionStream==="undefined") throw new Error("navegador sem descompressão nativa: descompacte o ZIP e importe a pasta");
          data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
        } else throw new Error("compressão tipo "+method+" não suportada: descompacte o ZIP e importe a pasta");
        if(data.length!==usize || crc32(data)!==crc) throw new Error("falha de integridade (CRC) ao extrair do ZIP");
        return (data.byteOffset===0&&data.byteLength===data.buffer.byteLength)?data.buffer:data.slice().buffer;
      }});
  }
  return out;
}

/* ---------- drag & drop (inclui pastas) ---------- */
async function entriesFromDataTransfer(dt){
  const out=[]; const items=dt.items?Array.from(dt.items):[];
  const entries=items.map(it=>it.webkitGetAsEntry&&it.webkitGetAsEntry()).filter(Boolean);
  if(entries.length){ for(const e of entries) await walkEntry(e,"",out); return out; }
  return Array.from(dt.files||[]);
}
function walkEntry(entry,prefix,out){
  return new Promise(res=>{
    if(entry.isFile){ entry.file(f=>{ f._path=(prefix?prefix+"/":"")+entry.name; out.push(f); res(); }, ()=>res()); }
    else if(entry.isDirectory){ const rd=entry.createReader(); const all=[];
      const read=()=>rd.readEntries(async es=>{ if(!es.length){ for(const c of all) await walkEntry(c,(prefix?prefix+"/":"")+entry.name,out); res(); }
        else { all.push(...es); read(); } }, ()=>res()); read();
    } else res();
  });
}

   PÁGINAS: Visão geral, Mídia, Laudos, Arquivo
   ===================================================================== */
// DICOM que contém imagem (DICOMDIR, laudos estruturados etc. não contam como imagem)
function isImageDicom(f){ return f.kind==="dicom" && !!(f.meta&&f.meta.pixel&&f.meta.pixel.present); }
function counts(){
  const c={series:0,studies:APP.studies.length,dicom:0,images:0,videos:0,pdfs:0,others:0,bytes:0,volumes:0,compressed:0};
  for(const f of APP.files){
    const dicomVideo=isImageDicom(f)&&f.meta.isVideo;
    c[dicomVideo?"videos":isImageDicom(f)?"dicom":f.kind==="image"?"images":f.kind==="video"?"videos":f.kind==="pdf"?"pdfs":"others"]++;
    c.bytes+=f.size||0; if(isImageDicom(f)&&f.meta.compressed&&!f.meta.isVideo)c.compressed++;
  }
  for(const st of APP.studies) for(const s of st.series){ c.series++; if(s.isVolume)c.volumes++; }
  return c;
}

function renderOverview(){
  const p=$("#page-overview"); const c=counts();
  p.innerHTML="";
  if(!APP.files.length){

async function thumbForVideoFile(f){
  try{
    const buf=await getBuf(f.id); const url=URL.createObjectURL(new Blob([buf],{type:f.type||"video/mp4"}));
    const v=document.createElement("video"); v.muted=true; v.preload="auto"; v.src=url;
    await new Promise((res,rej)=>{ v.onloadeddata=res; v.onerror=rej; setTimeout(rej,8000); });
    const t=isFinite(v.duration)&&v.duration>0?Math.min(1,v.duration/3):0;
    if(t>0){ await new Promise(res=>{ v.onseeked=res; v.currentTime=t; setTimeout(res,3000); }); }
    const c=document.createElement("canvas"); const r=Math.min(1,240/Math.max(v.videoWidth,v.videoHeight)||1);
    c.width=Math.max(1,Math.round(v.videoWidth*r)); c.height=Math.max(1,Math.round(v.videoHeight*r));
    c.getContext("2d").drawImage(v,0,0,c.width,c.height); URL.revokeObjectURL(url);
    return c.toDataURL("image/jpeg",0.8);
  }catch(e){ return null; }
}

/* =====================================================================
   GERADOR DE ZIP (método STORE) + EXPORTAÇÃO / BACKUP
   ===================================================================== */
function buildZipBlob(entries){
  const enc=new TextEncoder();
  const chunks=[]; const central=[]; let offset=0;
  function u16(n){ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; }
  function u32(n){ const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n>>>0,true); return b; }
  // ZIP clássico (sem ZIP64): no máximo 65535 entradas e ~4 GB
  const total=entries.reduce((a,e)=>a+(e.bytes.length||e.bytes.byteLength||0),0);
  if(entries.length>65535 || total>0xFFFFFFFF-50*1024*1024)
    throw new Error("Backup grande demais para um único .zip ("+fmtBytes(total)+"). Exporte por série.");
  const now=new Date();
  const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const e of entries){
    const nameBytes=enc.encode(e.name);
    const data=e.bytes instanceof Uint8Array?e.bytes:new Uint8Array(e.bytes);
    const crc=crc32(data);
    const local=[u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),nameBytes];
    for(const c of local) chunks.push(c); chunks.push(data);
    const localSize=30+nameBytes.length+data.length;
    central.push([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nameBytes]);
    offset+=localSize;
  }
  const cdStart=offset; const cdParts=[];
  for(const c of central){ for(const part of c){ cdParts.push(part); offset+=part.length; } }
  const cdSize=offset-cdStart;
  const eocd=[u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(cdSize),u32(cdStart),u16(0)];
  return new Blob([...chunks,...cdParts,...eocd],{type:"application/zip"});
}

function looseFiles(){
  const inSeries=new Set(); for(const st of APP.studies) for(const s of st.series) for(const f of s.instances) inSeries.add(f.id);
  return APP.files.filter(f=>!inSeries.has(f.id));
