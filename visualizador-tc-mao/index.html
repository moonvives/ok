/* =====================================================================
   IMPORTAÇÃO — leitura, classificação, hash e gravação local
   ===================================================================== */
let IMPORTING=false;
function uid(){ try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return "f_"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

async function importFiles(fileList, progressCb){
  if(IMPORTING){ toast("Importação já em andamento…","warn"); return; }
  IMPORTING=true;
  const report={discovered:0, imported:0, duplicates:0, failed:0, dicom:0, images:0, videos:0, pdfs:0, others:0, compressedSeries:0, zips:0, bytes:0, shared:0, items:[]};
  // pacotes .zip (como os baixados do portal) são abertos aqui mesmo, sem descompactar antes
  const files=[];
  for(const f of Array.from(fileList)){
    if(isZipFile(f)){
      progressCb&&progressCb(0,1,"abrindo "+f.name);
      try{ files.push(...await expandZip(f)); report.zips++; }
      catch(e){ report.failed++; report.items.push({name:f.name,status:"falha",error:String(e&&e.message||e)}); }
    } else files.push(f);
  }
  report.discovered=files.length+report.failed;
  const known=new Set(APP.files.map(f=>f.hash));
  let done=0;
  for(const file of files){
    try{
      const buf=await file.arrayBuffer();
      const u8=new Uint8Array(buf);
      const relPath=file.webkitRelativePath||file._path||file.name;
      const folder=relPath.includes("/")?relPath.split("/").slice(0,-1).join("/"):"";
      let kind=kindFromFile(file.name,file.type);
      if(kind==="other"||kind==="dicom"){ if(looksDicom(u8)) kind="dicom"; }
      const hash=await sha256Hex(buf);
      if(known.has(hash)){ report.duplicates++; report.items.push({name:file.name,status:"duplicado"}); done++; progressCb&&progressCb(done,files.length,file.name); continue; }
      known.add(hash);

      // exame publicado: laudo, PDFs, imagens e vídeos vão para o armazenamento do site
      const st=REMOTE.on&&SHARED.canWrite&&buf.byteLength<=SHARE_MAX?shareType(file,kind):null;
      if(st){
        try{ await shareUpload(file.name,buf,st,kind,hash);
          report.shared++; report.imported++; report.bytes+=file.size; report[kind==="pdf"?"pdfs":kind==="image"?"images":"videos"]++;
          report.items.push({name:file.name,status:"importado",kind,size:file.size,where:"site"});
          done++; progressCb&&progressCb(done,files.length,file.name); continue;
        }catch(e){ report.shareFailed=(report.shareFailed||0)+1; }   // segue e guarda neste dispositivo
      }

      const rec={ id:uid(), name:file.name, folder, path:relPath, size:file.size, type:file.type||"",
        kind, hash, hashAlgo:"SHA-256", addedAt:new Date().toISOString(), meta:null, sourceZip:file._zip||null };

      if(kind==="dicom"){
        try{ rec.meta=parseDicom(buf);
          if(rec.meta.isVideo) report.videos++;
          else { if(rec.meta.compressed) report.compressedSeries++; report.dicom++; } }
        catch(e){ rec.kind="other"; rec.parseError=String(e&&e.message||e); report.others++; }
      } else if(kind==="image"){ report.images++; }
      else if(kind==="video"){ report.videos++; }
      else if(kind==="pdf"){ report.pdfs++; }
      else report.others++;

      await saveAsset(rec, buf);
      APP.files.push(rec);
      report.imported++; report.bytes+=file.size;
      report.items.push({name:file.name,status:"importado",kind:rec.kind,size:file.size});
    }catch(e){
      report.failed++; report.items.push({name:file.name,status:"falha",error:String(e&&e.message||e)});
    }
    done++; progressCb&&progressCb(done,files.length,file.name);
  }
  buildHierarchy();
  renderSeriesList();
  updateTopStatus();
  APP.report=report;
  IMPORTING=false;
  return report;
}

/* ---------- leitor de ZIP (sem bibliotecas: método STORE e DEFLATE nativo do navegador) ---------- */
function isZipFile(f){ return /\.zip$/i.test(f.name||"") || /(^|\/)(x-)?zip(-compressed)?$/i.test(f.type||""); }
async function expandZip(file){
  // diretório central: lido do fim do arquivo, sem carregar o .zip inteiro na memória
  const tailLen=Math.min(file.size,65535+22);
  const tail=new Uint8Array(await file.slice(file.size-tailLen).arrayBuffer());
  const tdv=new DataView(tail.buffer);
  let e=-1; for(let i=tail.length-22;i>=0;i--){ if(tdv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("não é um ZIP válido (diretório central ausente)");
  const count=tdv.getUint16(e+10,true), cdSize=tdv.getUint32(e+12,true), cdOff=tdv.getUint32(e+16,true);
  if(count===0xFFFF||cdSize===0xFFFFFFFF||cdOff===0xFFFFFFFF)
    throw new Error("ZIP64 (pacote acima de 4 GB): descompacte no computador e importe a pasta");
  const cd=new Uint8Array(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()); const dv=new DataView(cd.buffer);
  const base=(file.name||"pacote").replace(/\.zip$/i,"");
  const out=[]; let p=0;
  for(let k=0;k<count && p+46<=cd.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("diretório central do ZIP corrompido");
    const flags=dv.getUint16(p+8,true), method=dv.getUint16(p+10,true), crc=dv.getUint32(p+16,true),
          csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true), nlen=dv.getUint16(p+28,true),
          xlen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), loff=dv.getUint32(p+42,true);
    const name=new TextDecoder(flags&0x800?"utf-8":"windows-1252").decode(cd.subarray(p+46,p+46+nlen));
    p+=46+nlen+xlen+clen;
    // pastas e metadados do macOS (__MACOSX) não são arquivos do exame
    if(name.endsWith("/")||name.startsWith("__MACOSX/")) continue;
    out.push({ name:name.split("/").pop(), size:usize, type:"", _path:base+"/"+name, _zip:file.name,
      arrayBuffer: async()=>{
        if(flags&1) throw new Error("arquivo protegido por senha dentro do ZIP");
        const lh=new DataView(await file.slice(loff,loff+30).arrayBuffer());
        if(lh.getUint32(0,true)!==0x04034b50) throw new Error("cabeçalho local inválido no ZIP");
        const start=loff+30+lh.getUint16(26,true)+lh.getUint16(28,true);
        const raw=new Uint8Array(await file.slice(start,start+csize).arrayBuffer());
        let data;
        if(method===0) data=raw;
        else if(method===8){
          if(typeof DecompressionStream==="undefined") throw new Error("navegador sem descompressão nativa: descompacte o ZIP e importe a pasta");
          data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
        } else throw new Error("compressão tipo "+method+" não suportada: descompacte o ZIP e importe a pasta");
        if(data.length!==usize || crc32(data)!==crc) throw new Error("falha de integridade (CRC) ao extrair do ZIP");
        return (data.byteOffset===0&&data.byteLength===data.buffer.byteLength)?data.buffer:data.slice().buffer;
      }});
  }
  return out;
}

/* ---------- drag & drop (inclui pastas) ---------- */
async function entriesFromDataTransfer(dt){
  const out=[]; const items=dt.items?Array.from(dt.items):[];
  const entries=items.map(it=>it.webkitGetAsEntry&&it.webkitGetAsEntry()).filter(Boolean);
  if(entries.length){ for(const e of entries) await walkEntry(e,"",out); return out; }
  return Array.from(dt.files||[]);
}
function walkEntry(entry,prefix,out){
  return new Promise(res=>{
    if(entry.isFile){ entry.file(f=>{ f._path=(prefix?prefix+"/":"")+entry.name; out.push(f); res(); }, ()=>res()); }
    else if(entry.isDirectory){ const rd=entry.createReader(); const all=[];
      const read=()=>rd.readEntries(async es=>{ if(!es.length){ for(const c of all) await walkEntry(c,(prefix?prefix+"/":"")+entry.name,out); res(); }
        else { all.push(...es); read(); } }, ()=>res()); read();
    } else res();
  });
}

// miniatura de vídeo: quadro capturado do próprio arquivo
async function thumbForVideoFile(f){
  try{
    const buf=await getBuf(f.id); const url=URL.createObjectURL(new Blob([buf],{type:f.type||"video/mp4"}));
    const v=document.createElement("video"); v.muted=true; v.preload="auto"; v.src=url;
    await new Promise((res,rej)=>{ v.onloadeddata=res; v.onerror=rej; setTimeout(rej,8000); });
    const t=isFinite(v.duration)&&v.duration>0?Math.min(1,v.duration/3):0;
    if(t>0){ await new Promise(res=>{ v.onseeked=res; v.currentTime=t; setTimeout(res,3000); }); }
    const c=document.createElement("canvas"); const r=Math.min(1,240/Math.max(v.videoWidth,v.videoHeight)||1);
    c.width=Math.max(1,Math.round(v.videoWidth*r)); c.height=Math.max(1,Math.round(v.videoHeight*r));
    c.getContext("2d").drawImage(v,0,0,c.width,c.height); URL.revokeObjectURL(url);
    return c.toDataURL("image/jpeg",0.8);
  }catch(e){ return null; }
}

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const SCRIPTS=new Map();
function loadScriptOnce(src){
  if(SCRIPTS.has(src)) return SCRIPTS.get(src);
  const pr=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script")); document.head.append(s); });
  pr.catch(()=>SCRIPTS.delete(src)); SCRIPTS.set(src,pr); return pr;
}
async function renderPdfPages(buf,box){

/* =====================================================================
   GERADOR DE ZIP (método STORE) + EXPORTAÇÃO / BACKUP
   ===================================================================== */
// ZIP (método STORE). Cada arquivo vira um Blob assim que é lido: a memória do JavaScript
// guarda um arquivo por vez, mesmo em exportações de centenas de MB.
// entries: [{name, bytes?:Uint8Array, get?:async()=>Uint8Array, check?:async(u8)=>void}]
async function zipFromEntries(entries,progress){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const u16=n=>{ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; };
  const u32=n=>{ const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n>>>0,true); return b; };
  if(entries.length>65535) throw new Error("Arquivos demais para um único .zip. Exporte por série.");
  const now=new Date();
  const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(let i=0;i<entries.length;i++){
    const e=entries[i];
    let data=e.bytes||await e.get(); if(!(data instanceof Uint8Array)) data=new Uint8Array(data);
    if(e.check) await e.check(data);
    const nameBytes=enc.encode(e.name), crc=crc32(data);
    if(offset+30+nameBytes.length+data.length>0xFFFFFFFF-50*1024*1024) throw new Error("Exportação acima de 4 GB. Exporte por série.");
    parts.push(new Blob([u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),nameBytes,data]));
    central.push([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nameBytes]);
    offset+=30+nameBytes.length+data.length;
    if(progress) progress(i+1,entries.length);
    if(i%8===7) await new Promise(r=>setTimeout(r,0));   // mantém a página respondendo
  }
  const cdStart=offset, cdParts=[];
  for(const c of central){ for(const part of c){ cdParts.push(part); offset+=part.length; } }
  const eocd=[u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(offset-cdStart),u32(cdStart),u16(0)];
  return new Blob([...parts,...cdParts,...eocd],{type:"application/zip"});
}

// arquivos que não pertencem a nenhuma série visível (vídeos, PDFs, DICOMDIR, outros)
function looseFiles(){
  const inSeries=new Set(); for(const st of APP.studies) for(const s of st.series) for(const f of s.instances) inSeries.add(f.id);

const LOOSE_FOLDER={video:"videos",pdf:"documentos",image:"imagens",dicom:"dicom_sem_imagem",other:"outros"};
function looseLabel(f){ return f.kind==="video"?"Vídeo original":f.kind==="pdf"?"Documento (PDF)":f.kind==="dicom"?"DICOM sem imagem (DICOMDIR / estruturado)":f.kind==="image"?"Imagem original":"Arquivo original"; }

async function exportEntries(fileSubset, zipName){
  toast("Gerando backup… isso pode levar alguns segundos.","",6000);
  const list=fileSubset||APP.files;
  const entries=[]; const checks=[]; const missing=[]; const used=new Set();
  // evita sobrescrever dois arquivos de mesmo nome na mesma pasta do .zip
  function uniquePath(p){ if(!used.has(p)){used.add(p);return p;} const dot=p.lastIndexOf("."); let i=2,q;
    do{ q=dot>p.lastIndexOf("/")?(p.slice(0,dot)+"_"+i+p.slice(dot)):(p+"_"+i); i++; }while(used.has(q)); used.add(q); return q; }
  async function add(f,folder){
    const buf=await getBuf(f.id); if(!buf){ missing.push(f.name); return; }
    const path=uniquePath("ARQUIVO_TC/"+folder+"/"+f.name);
    entries.push({name:path,bytes:new Uint8Array(buf)});
    checks.push(f.hash+"  "+path);
  }
  for(const st of APP.studies){
    for(const s of st.series){
      for(const f of s.instances){
        if(!list.includes(f)) continue;
        await add(f, safeName(st.uid==="MIDIA-IMPORTADA"?"midia":(st.desc||"estudo"))+"/"+safeName(s.desc||("serie_"+s.number)));
      }
    }
  }
  // vídeos, PDFs, DICOMDIR e demais arquivos: também vão para o backup
  for(const f of looseFiles()){ if(list.includes(f)) await add(f, LOOSE_FOLDER[f.kind]||"outros"); }
  if(missing.length) toast("Atenção: "+missing.length+" arquivo(s) sem dados locais não entraram no backup: "+missing.map(esc).join(", "),"err",9000);
  const enc=new TextEncoder();
  entries.push({name:"ARQUIVO_TC/manifest.json",bytes:enc.encode(JSON.stringify(buildManifest(list),null,2))});
  entries.push({name:"ARQUIVO_TC/integridade/checksums.sha256",bytes:enc.encode(checks.join("\n")+"\n")});
  entries.push({name:"ARQUIVO_TC/LEIA-ME.txt",bytes:enc.encode(
    "TOMOGRAFIA COMPUTADORIZADA - ARQUIVOS DO EXAME\n\n"+
    "Conteudo: arquivos originais do exame, manifest.json e integridade/checksums.sha256 (SHA-256).\n\n"+
    "Para abrir: abra o index.html no navegador, clique em Importar e selecione este .zip ou a pasta.\n\n"+
    "Gerado em "+new Date().toLocaleString("pt-BR")+"\n"
  )});
  let blob;
  try{ blob=await zipFromEntries(entries); }
  catch(e){ toast(esc(e.message),"err",9000); return; }
  await saveFile((zipName||("ARQUIVO_TC_"+nowStamp()))+".zip", blob);
  toast("Backup gerado ("+fmtBytes(blob.size)+", "+(entries.length-3)+" arquivo(s) original(is)).","ok",5000);
}

/* =====================================================================
   SITE COMPLETO EM ARQUIVO ÚNICO
   Gera um .html com o visualizador e todos os arquivos do exame embutidos
   (base64, um bloco por arquivo). Ao abrir, o exame é carregado sozinho.
   Obs.: as tags de script são escritas como "<\/script>" para não encerrar
   este próprio bloco de código no HTML.
   ===================================================================== */
let APP_SOURCE="";
const EMBED={files:[],bundle:null};

// chamado no início do boot: separa os dados embutidos e guarda o código-fonte limpo do site
function captureEmbedded(){
  for(const n of document.querySelectorAll('script[type="application/x-exam-file"]')){
    EMBED.files.push({name:n.dataset.name||"arquivo",path:n.dataset.path||n.dataset.name||"arquivo",
      type:n.dataset.type||"",size:parseInt(n.dataset.size||"0",10)||0,b64:n.textContent});
    n.remove();
  }
  const b=document.getElementById("exam-bundle");
  if(b){ try{ EMBED.bundle=JSON.parse(b.textContent); }catch(e){} b.remove(); }
  APP_SOURCE="<!DOC"+"TYPE html>\n"+document.documentElement.outerHTML;
}

function bufToB64(buf){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const s=fr.result; res(s.slice(s.indexOf(",")+1)); };
    fr.onerror=()=>rej(fr.error); fr.readAsDataURL(new Blob([buf])); });
}
async function b64ToBuf(b64){
  try{ const r=await fetch("data:application/octet-stream;base64,"+b64); if(r.ok) return await r.arrayBuffer(); }catch(e){}
  const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer;
}

function showLoading(label,frac){
  let o=$("#loadingOverlay");
  if(!o){ o=el("div",{id:"loadingOverlay"},el("div",{class:"lo-box"},el("div",{class:"lo-t",id:"loLabel"}),
      el("div",{class:"progress"},el("div",{class:"bar",id:"loBar"})))); document.body.append(o); }
  $("#loLabel").textContent=label; $("#loBar").style.width=(clamp(frac,0,1)*100).toFixed(1)+"%";
}
function hideLoading(){ const o=$("#loadingOverlay"); if(o) o.remove(); }

// carrega no armazenamento local os arquivos embutidos (uma única vez por arquivo .html)
async function loadEmbedded(){
  if(!EMBED.files.length) return;
  const id=EMBED.bundle&&EMBED.bundle.id;
  const seen=id?await idbGet("meta","bundleId"):null;
  if(!(id && seen===id && APP.files.length)){
    const list=EMBED.files.map(e=>({name:e.name,size:e.size,type:e.type,_path:e.path,arrayBuffer:()=>b64ToBuf(e.b64)}));
    showLoading("Carregando exame…",0);
    await importFiles(list,(d,t)=>showLoading("Carregando exame… "+d+" / "+t,d/t));
    // medições gravadas no arquivo: chaveadas pelo SHA-256 do arquivo de origem
    if(EMBED.bundle&&EMBED.bundle.info){ APP.examInfo=EMBED.bundle.info; try{ await idbPut("meta",APP.examInfo,"examInfo"); }catch(e){} }
    const meas=(EMBED.bundle&&EMBED.bundle.meas)||{};
    const byHash=new Map(APP.files.map(f=>[f.hash,f.id]));
    for(const k in meas){ const [h,fr]=k.split("#"); const fid=byHash.get(h); if(fid) APP.measurements[fr?fid+"#"+fr:fid]=meas[k]; }
    await persistMeas();
    if(id){ try{ await idbPut("meta",id,"bundleId"); }catch(e){} }
    hideLoading();
  }
  EMBED.files=[]; // libera a memória dos dados em texto
}

function suggestedName(){
  const h=examHeading(); const base=[h.title||"Tomografia",h.m&&h.m.studyDate?h.m.studyDate:(h.date||"").replace(/\//g,"-")].filter(Boolean).join("_");
  return safeName(base)||"Tomografia";
}

async function exportStandaloneSite(){
  if(!APP.files.length) return;
  const src=APP_SOURCE, cut=src.lastIndexOf("</bo"+"dy>");
  if(cut<0){ toast("Não foi possível gerar o arquivo.","err"); return; }
  const parts=[src.slice(0,cut)];
  const idToHash=new Map(APP.files.map(f=>[f.id,f.hash]));
  const meas={};
  for(const k in APP.measurements){ const [fid,fr]=k.split("#"); const h=idToHash.get(fid);
    if(h&&APP.measurements[k]&&APP.measurements[k].length) meas[fr?h+"#"+fr:h]=APP.measurements[k]; }
  const bundle={id:uid(),created:new Date().toISOString(),files:APP.files.length,meas,info:APP.examInfo||null};
  parts.push('\n<script type="application/json" id="exam-bundle">'+JSON.stringify(bundle).replace(/</g,"\\u003c")+"<\/script>\n");
  let i=0, total=0;
  for(const f of APP.files){
    showLoading("Gerando arquivo… "+(i+1)+" / "+APP.files.length,i/APP.files.length);
    const buf=await getBuf(f.id); i++; if(!buf) continue;
    parts.push('<script type="application/x-exam-file" data-name="'+esc(f.name)+'" data-path="'+esc(f.path||f.name)+
      '" data-type="'+esc(f.type||"")+'" data-size="'+(f.size||buf.byteLength)+'">',await bufToB64(buf),"<\/script>\n");
    total+=buf.byteLength;
  }
  parts.push(src.slice(cut));
  const blob=new Blob(parts,{type:"text/html"});
  hideLoading();
  downloadBytes(suggestedName()+".html",blob);
  toast("Arquivo gerado: "+fmtBytes(blob.size)+".","ok",5000);
}

/* =====================================================================
   EXAME PUBLICADO (modo site)
   Ativado por <meta name="exam-manifest" content="...">. Os arquivos ORIGINAIS do CD
   (DICOM, DICOMDIR, JPEG) são publicados byte a byte dentro de pacotes gzip; o
   manifest.json traz o índice (pacote, deslocamento, tamanho, SHA-256) e os metadados
   que montam as séries antes de baixar qualquer pixel.
   ===================================================================== */
const REMOTE={on:false,manifest:null,index:new Map(),packs:new Map(),bytes:0};
function packBudget(){ let coarse=false; try{ coarse=matchMedia("(pointer:coarse)").matches; }catch(e){} return (coarse?160:420)*1024*1024; }
async function gunzipBytes(u8){
  if(u8[0]!==0x1f||u8[1]!==0x8b) return u8;   // entregue já descomprimido
  if(typeof DecompressionStream==="undefined") throw new Error("Este navegador não abre os dados do exame. Use Chrome, Edge, Safari ou Firefox atualizados.");
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
}
function remotePack(i){
  let e=REMOTE.packs.get(i);
  if(e){ REMOTE.packs.delete(i); REMOTE.packs.set(i,e); return e.pr; }   // mais recente por último (LRU)
  const P=REMOTE.manifest.packs[i];
  e={size:P.rawSize,pr:null};
  e.pr=fetch(P.file).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status+" em "+P.file); return r.arrayBuffer(); })
    .then(b=>gunzipBytes(new Uint8Array(b)))
    .then(u=>{ if(u.length!==P.rawSize) throw new Error("Pacote incompleto: "+P.file); return u; });
  e.pr.catch(()=>{ if(REMOTE.packs.get(i)===e){ REMOTE.packs.delete(i); REMOTE.bytes-=e.size; } });
  REMOTE.packs.set(i,e); REMOTE.bytes+=e.size;
  for(const [k,v] of REMOTE.packs){   // libera os pacotes usados há mais tempo
    if(REMOTE.bytes<=packBudget()||REMOTE.packs.size<=2) break;
    if(k===i) continue; REMOTE.packs.delete(k); REMOTE.bytes-=v.size;
  }
  return e.pr;
}
// bytes originais de um arquivo do CD (cópia própria, pronta para ler ou salvar)
async function remoteBytes(r){ const u=await remotePack(r.pack); return u.slice(r.off,r.off+r.len).buffer; }

// quadro de qualquer instância DICOM. No exame publicado o cabeçalho completo é lido do
// próprio arquivo na primeira vez; os metadados do manifest servem só para montar a lista.
async function frameFor(f,k=0){
  const buf=await getBuf(f.id); if(!buf) return null;
  if(f.provisional){ try{ f.meta=parseDicom(buf); }catch(e){} f.provisional=false; }
  return extractModality(f.meta,buf,k);
}
function yyyymmdd(d){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d||""); return m?m[3]+m[2]+m[1]:(d||""); }
function fmtAge(a){ const m=/^(\d{3})([YMWD])$/.exec(a||""); if(!m) return a||""; const n=parseInt(m[1],10);
  return n+" "+({Y:n===1?"ano":"anos",M:n===1?"mês":"meses",W:"semanas",D:"dias"})[m[2]]; }
const POSITIONS={HFP:"Cabeça primeiro, decúbito ventral (HFP)",HFS:"Cabeça primeiro, decúbito dorsal (HFS)",FFP:"Pés primeiro, decúbito ventral (FFP)",
  FFS:"Pés primeiro, decúbito dorsal (FFS)",HFDR:"Cabeça primeiro, decúbito lateral direito (HFDR)",HFDL:"Cabeça primeiro, decúbito lateral esquerdo (HFDL)",
  FFDR:"Pés primeiro, decúbito lateral direito (FFDR)",FFDL:"Pés primeiro, decúbito lateral esquerdo (FFDL)"};

        meta:{rows:it.rows,cols:it.cols,bitsAllocated:it.bits,bitsStored:it.bits,pixelRep:0,samplesPerPixel:it.spp,
          photometric:it.photometric||"MONOCHROME2",planar:0,numberOfFrames:it.frames||1,rescaleSlope:1,rescaleIntercept:0,
          windowCenter:rgb?null:it.wc,windowWidth:rgb?null:it.ww,pixelSpacing:it.ps||s.pixelSpacing,sliceThickness:s.sliceThickness,
          ipp:it.ipp,iop:s.iop,instanceNumber:it.instance,sliceLocation:it.sliceLocation,studyUID:st.uid,seriesUID:s.uid,sopUID:it.sop,
          modality:s.modality,seriesNumber:s.number,seriesDesc:s.description,studyDesc:st.description,studyDate:yyyymmdd(st.date),
          studyTime:st.time,bodyPart:st.bodyPart,patientName:P.name,patientID:P.id,patientBirth:yyyymmdd(P.birth),patientSex:P.sex,
          manufacturer:st.manufacturer,model:st.model,stationName:st.station,institution:st.institution,referringPhysician:st.referringPhysician,

  for(const e of M.extra||[]){

    if(e.kind==="jpeg"){

        kind:e.kind==="dicomdir"?"dicom":"other",remote:rem,

    }

/* ---------- documentos guardados no site (laudo, PDFs, imagens, vídeos) ----------
   Dentro do claude.ai o arquivo fica no armazenamento do site e o índice no banco de
   dados do site: quem pode editar o site adiciona e remove, os demais visualizam. */
const SHARED={index:new Map(),canWrite:false,ready:false,db:null,assets:null};
const SHARE_MAX=20*1024*1024;
const SHARE_TYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",mp4:"video/mp4",webm:"video/webm"};
function inArtifact(){ try{ return !!(window.claude&&typeof window.claude.use==="function"); }catch(e){ return false; } }
function capUse(name){ if(!inArtifact()) return Promise.resolve(null); try{ return Promise.resolve(window.claude.use(name)).catch(()=>null); }catch(e){ return Promise.resolve(null); } }
function shareType(file,kind){
  if(!(kind==="pdf"||kind==="image"||kind==="video")) return null;
  const ext=(String(file.name||"").split(".").pop()||"").toLowerCase(), t=SHARE_TYPES[ext]||null;
  return t&&(!file.type||Object.values(SHARE_TYPES).includes(file.type))?t:null;
}
async function initShared(){
  if(!REMOTE.on||!inArtifact()) return;
  const db=await capUse("db"); if(!db) return;
  SHARED.db=db;
  SHARED.assets=await capUse("assets");   // só quem pode editar o site recebe
  let edit=!!SHARED.assets;
  const user=await capUse("user");
  if(edit&&user){ try{ if((await user.canEdit())===false) edit=false; }catch(e){} }
  SHARED.canWrite=edit;
  try{ db.collection("documentos").onSnapshot(snap=>applySharedDocs(snap.docs.map(d=>({id:d.id,...(d.data()||{})}))),
    err=>console.warn("documentos:",err&&err.code)); }
  catch(e){ console.warn(e); }
  SHARED.ready=true; refreshPagesAfterData();
}
function applySharedDocs(list){
  APP.files=APP.files.filter(f=>!f.shared); SHARED.index=new Map();
  list.sort((a,b)=>String(a.addedAt||"").localeCompare(String(b.addedAt||"")));
  for(const d of list){
    if(!d.assetId||!d.name) continue;
    const rec={id:"sh_"+d.id,name:d.name,path:"documentos/"+d.name,size:d.size||0,hash:d.sha256||"",type:d.type||"",
      kind:d.kind||kindFromFile(d.name,d.type),folder:"Documentos adicionados",addedAt:d.addedAt||"",shared:{docId:d.id,assetId:d.assetId}};
    APP.files.push(rec); SHARED.index.set(rec.id,rec);
  }
  buildHierarchy(); renderSeriesList(); updateTopStatus(); refreshPagesAfterData();
}
async function sharedBytes(rec){ const r=await fetch("/_blob/"+rec.shared.assetId); if(!r.ok) throw new Error("HTTP "+r.status); return r.arrayBuffer(); }
async function shareUpload(name,buf,type,kind,hash){
  const up=await SHARED.assets.upload(new Blob([buf],{type}),{type});
  await SHARED.db.collection("documentos").doc(hash.slice(0,40)).set({name,kind,type,size:buf.byteLength,sha256:hash,assetId:up.id,addedAt:new Date().toISOString()});
}
async function removeShared(rec){
  if(!(await confirmInPage("Remover documento","Remover "+rec.name+" do site? Ele deixa de aparecer para todos que abrem o exame.","Remover"))) return;
  try{ await SHARED.db.collection("documentos").doc(rec.shared.docId).delete();
    try{ await SHARED.assets.delete(rec.shared.assetId); }catch(e){}
    toast("Documento removido.","ok"); }
  catch(e){ toast("Não foi possível remover o documento.","err",6000); }
}

/* ---------- salvar arquivos ----------
   No claude.ai o arquivo é entregue pelo recurso de downloads (com confirmação de quem
   está vendo); fora dele, pelo download comum do navegador. Tipos que o recurso não
   aceita (DICOM, DICOMDIR...) seguem dentro de um .zip, sem alteração dos bytes. */
const DL_OK=/\.(gif|png|jpe?g|webp|mp4|webm|mov|txt|json|md|docx|pptx|epub|csv|ttf|html|svg|pdf|xlsx|zip)$/i;
async function saveFile(name,data,mime){
  name=name||"arquivo";
  let blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  if(inArtifact()){
    const dl=await capUse("downloads");
    if(!dl){ toast("Salvar arquivos não está disponível nesta visualização.","warn",6000); return false; }
    if(!DL_OK.test(name)){
      blob=await zipFromEntries([{name,bytes:new Uint8Array(await blob.arrayBuffer())}]);
      name=(/\.[^.\/]+$/.test(name)?name.replace(/\.[^.\/]+$/,""):name)+".zip";
    }
    try{ await dl.save({filename:name,data:blob}); return true; }
    catch(e){ const c=e&&e.code; if(c==="declined") return false;
      toast(c==="too_large"?"Arquivo grande demais para este aparelho. Exporte por série.":c==="rate_limited"?"Conclua a confirmação anterior e tente de novo.":"Não foi possível salvar o arquivo.","warn",7000);
      return false; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},60000);   // folga para downloads grandes
  return true;
}
function downloadBytes(name,buf,mime){ return saveFile(name,buf,mime); }

/* ---------- exportação do exame publicado ---------- */
function cdRootName(){ const st=(REMOTE.manifest&&REMOTE.manifest.study)||{}; return safeName([st.description||"Exame",(st.date||"").replace(/\//g,"-")].filter(Boolean).join("_")); }
// arquivos do CD em .zip, com a mesma estrutura de pastas do CD e conferência SHA-256 de cada arquivo
async function exportCD(files,name){
  const root=cdRootName(), list=files.filter(f=>f.remote).sort((a,b)=>a.path.localeCompare(b.path)), sums=[];
  if(!list.length) return;
  const entries=list.map(f=>{ const rel=f.path.replace(/^exam\//,"");
    return {name:root+"/"+rel, get:async()=>new Uint8Array(await getBuf(f.id)),
      check:async d=>{ const h=await sha256Hex(d.buffer); if(h!==f.hash) throw new Error("Falha de integridade em "+rel+"."); sums.push(h+"  "+rel); }}; });
  entries.push({name:root+"/SHA256SUMS.txt",get:async()=>new TextEncoder().encode(sums.join("\n")+"\n")});
  showLoading("Preparando "+name+".zip…",0);
  try{
    const blob=await zipFromEntries(entries,(d,t)=>showLoading("Preparando "+name+".zip… "+d+" / "+t,d/t));
    hideLoading(); await saveFile(name+".zip",blob);
  }catch(e){ hideLoading(); toast(esc(e.message||String(e)),"err",9000); }
}
async function exportInventoryCSV(){
  const M=REMOTE.manifest, q=s=>'"'+String(s).replace(/"/g,'""')+'"';

  await saveFile(cdRootName()+"_inventario_SHA256.csv","﻿"+lines.join("\r\n")+"\r\n","text/csv");
}

/* =====================================================================
   VOLUME (para MPR e MIP) — construído só de séries com volume 3D válido
   ===================================================================== */
const VOL_PENDING=new Map();
async function buildVolume(s,progress){
  if(APP.volumes[s.id]) return APP.volumes[s.id];
  if(VOL_PENDING.has(s.id)){ const p=VOL_PENDING.get(s.id); if(progress) p.listeners.push(progress); return p.pr; }
  const job={listeners:progress?[progress]:[],pr:null};
  job.pr=(async()=>{
    const m0=s.instances[0].meta; const nx=m0.cols, ny=m0.rows, nz=s.instances.length;
    if(nx*ny*nz*2 > 500*1024*1024) throw new Error("Volume grande demais para reconstruir neste navegador ("+nx+"×"+ny+"×"+nz+").");
    const vol=new Int16Array(nx*ny*nz);
    for(let z=0;z<nz;z++){
      const fr=await frameFor(s.instances[z],0); if(!fr) throw new Error("Falha ao ler o corte "+(z+1));
      if(fr.color||fr.width!==nx||fr.height!==ny) throw new Error("Corte "+(z+1)+" com formato diferente dos demais.");
      const base=z*nx*ny; const v=fr.values;
      for(let i=0;i<nx*ny;i++){ let x=v[i]; if(x>32767)x=32767; else if(x<-32768)x=-32768; vol[base+i]=x; }
      for(const cb of job.listeners) try{ cb(z+1,nz); }catch(e){}
    }
    const m1=s.instances[0].meta;   // cabeçalho completo, já lido do arquivo
    const colSp=m1.pixelSpacing?m1.pixelSpacing[1]:1, rowSp=m1.pixelSpacing?m1.pixelSpacing[0]:1;
    const sliceSp=s._sliceSpacing||m1.sliceThickness||1;
    const V3={nx,ny,nz,vol,colSp,rowSp,sliceSp,series:s};
    for(const k in APP.volumes) delete APP.volumes[k];   // um volume por vez na memória
    APP.volumes[s.id]=V3; return V3;
  })();
  VOL_PENDING.set(s.id,job);
  try{ return await job.pr; } finally{ VOL_PENDING.delete(s.id); }
}
function planeFrame(width,height,values){ return {color:false,mono1:false,width,height,values}; }

// Extrai planos do volume (vizinho mais próximo). Os cortes estão em ordem crescente de
// posição ao longo da normal (em geral: inferior -> superior), então nos planos coronal e
// sagital a linha da tela j corresponde a z = nz-1-j: o lado superior fica no topo,
// como no padrão radiológico.
function sliceAxial(V3,z){ const{nx,ny,vol}=V3; const out=new Float32Array(nx*ny); const b=z*nx*ny; for(let i=0;i<nx*ny;i++)out[i]=vol[b+i]; return planeFrame(nx,ny,out); }
function sliceCoronal(V3,y){ const{nx,ny,nz,vol}=V3; const out=new Float32Array(nx*nz); for(let j=0;j<nz;j++){ const b=(nz-1-j)*nx*ny+y*nx; for(let x=0;x<nx;x++)out[j*nx+x]=vol[b+x]; } return planeFrame(nx,nz,out); }
function sliceSagittal(V3,x){ const{nx,ny,nz,vol}=V3; const out=new Float32Array(ny*nz); for(let j=0;j<nz;j++){ const b=(nz-1-j)*nx*ny+x; for(let y=0;y<ny;y++)out[j*ny+y]=vol[b+y*nx]; } return planeFrame(ny,nz,out); }

function drawMPRAll(){ if(!MPR.V3)return; drawMPRPlane("ax"); drawMPRPlane("co"); drawMPRPlane("sa"); updMprCursor(); }
function drawMPRPlane(id){
  const V3=MPR.V3; let frame,hx,hy,asp,lbl;
  if(id==="ax"){ frame=sliceAxial(V3,MPR.z); hx=MPR.x; hy=MPR.y; asp=V3.rowSp/V3.colSp; lbl="corte "+(MPR.z+1)+"/"+V3.nz; }
  else if(id==="co"){ frame=sliceCoronal(V3,MPR.y); hx=MPR.x; hy=V3.nz-1-MPR.z; asp=V3.sliceSp/V3.colSp; lbl="y "+(MPR.y+1)+"/"+V3.ny; }
  else { frame=sliceSagittal(V3,MPR.x); hx=MPR.y; hy=V3.nz-1-MPR.z; asp=V3.sliceSp/V3.rowSp; lbl="x "+(MPR.x+1)+"/"+V3.nx; }
  const src=frameToCanvas(frame,MPR.ww,MPR.wl,false);
  // cabe na largura da célula E numa altura máxima, para os três planos ficarem visíveis juntos
  const cv=$("#mpr-"+id);
  const avail=Math.max(120,(cv.parentElement.clientWidth||380)-16);
  const maxH=Math.max(140,(window.innerHeight-340)/2);   // 2 linhas de planos abaixo do cabeçalho
  const scale=Math.min(avail/frame.width, maxH/(frame.height*asp));
  cv.width=Math.max(1,Math.round(frame.width*scale)); cv.height=Math.max(1,Math.round(frame.height*scale*asp));
  cv.style.width=cv.width+"px"; cv.style.height=cv.height+"px";
  const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=true; ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(src,0,0,cv.width,cv.height);
  // cursor
  ctx.strokeStyle="rgba(79,156,249,.8)"; ctx.lineWidth=1;
  const px=hx*scale, py=hy*scale*asp;
  ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,cv.height); ctx.moveTo(0,py); ctx.lineTo(cv.width,py); ctx.stroke();
  const lab=$("#mpr-"+id+"-lbl"); if(lab)lab.textContent=lbl;
  cv._scale=scale; cv._asp=asp; cv._fw=frame.width; cv._fh=frame.height;
}
function wireMPRCanvas(cid,id){
  const cv=$("#"+cid); if(cv._wired)return; cv._wired=true;
  const handler=e=>{ const r=cv.getBoundingClientRect(); const sx=(e.clientX-r.left)/cv._scale; const sy=(e.clientY-r.top)/(cv._scale*cv._asp);
    const ix=clamp(Math.round(sx),0,cv._fw-1), iy=clamp(Math.round(sy),0,cv._fh-1);
    const nz=MPR.V3.nz;
    if(id==="ax"){ MPR.x=ix; MPR.y=iy; } else if(id==="co"){ MPR.x=ix; MPR.z=nz-1-iy; } else { MPR.y=ix; MPR.z=nz-1-iy; }
    drawMPRAll(); };
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);cv._drag=true;handler(e);});
  cv.addEventListener("pointermove",e=>{if(cv._drag)handler(e);});
  cv.addEventListener("pointerup",e=>{cv._drag=false;});
}

function setupSlab(){ const V3=MIPS.V3; if(!V3)return; const max=MIPS.dir==="ax"?V3.nz:MIPS.dir==="co"?V3.ny:V3.nx; const sl=$("#mipSlab"); if(sl)sl.max=max; }

function scheduleMIP(){ if(mipRaf)return; mipRaf=requestAnimationFrame(()=>{ mipRaf=0; drawMIP(); }); }
function drawMIP(){
  const V3=MIPS.V3; if(!V3)return; const {nx,ny,nz,vol}=V3; const nxy=nx*ny; const dir=MIPS.dir;
  const axisLen = dir==="ax"?nz:dir==="co"?ny:nx;

  const set=(id,v,txt)=>{ const r=$("#"+id); if(r){ r.value=v; const t=$("#"+id+"V"); if(t) t.textContent=txt; } };
  const thr=VR.mode===1?VR.thrS:VR.thr; set("vrThr",thr,thr+" HU"); set("vrWW",VR.ww,String(VR.ww)); set("vrWL",VR.wl,String(VR.wl));
}
function vrReset(){
  VR.mode=0; VR.thr=250; VR.thrS=300; VR.opac=0.9; VR.skin=0.35; VR.clip=[0,1,0,1,0,1]; VR.cut=0;
  if(VR.series){ const m0=VR.series.instances[0].meta; VR.ww=Math.round(m0.windowWidth||2000); VR.wl=Math.round(m0.windowCenter!=null?m0.windowCenter:400); }
  const c=$("#vrCut"); if(c){ c.value=0; $("#vrCutV").textContent="sem corte"; }
  const o=$("#vrOp"); if(o){ o.value=90; $("#vrOpV").textContent="90%"; }
  const k=$("#vrSkin"); if(k){ k.value=35; $("#vrSkinV").textContent="35%"; }
  vrBuildClip(); vrSyncControls(); vrSetView("Anterior");
}

/* =====================================================================
   PÁGINA FOCO NO POLEGAR (estação dedicada à mão/punho)
   ===================================================================== */
const THUMB={series:null,index:0,frame:null,zoom:3,ww:WINDOW_PRESETS[0].ww,wl:WINDOW_PRESETS[0].wl};
function renderThumb(){
  const p=$("#page-thumb"); p.innerHTML="";
  const dicomSeries=APP.studies.flatMap(st=>st.series).filter(s=>s.kind==="dicom"&&!s.instances[0].meta.compressed);
  if(!dicomSeries.length){ p.style.padding="22px 26px"; p.append(el("h1",{text:"Punho e mão"}),el("div",{class:"muted-c",text:"Nenhuma série disponível."})); return; }
  p.style.padding="0";
  const top=el("div",{style:"padding:14px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap"});
  const sel=el("select",{class:"mini"}); dicomSeries.forEach((s,i)=>sel.append(el("option",{value:i,text:s.desc||"Série"})));
  top.append(el("div",{},el("div",{style:"font-size:15px;font-weight:650",text:"Punho e mão"}),
    el("div",{class:"muted-c",style:"font-size:11.5px",text:"Janela óssea · Lupa"})),
    el("span",{style:"flex:1"}),el("span",{class:"muted-c",style:"font-size:12px",text:"Série:"}),sel,
    el("button",{class:"btn ghost",text:"Abrir MPR",onclick:()=>setView("mpr")}));
  p.append(top);
  const main=el("div",{style:"flex:1;display:flex;min-height:0"});
  const left=el("div",{style:"flex:1;position:relative;background:#000;min-width:0"},
    el("canvas",{id:"thumbCanvas",style:"position:absolute;inset:0;width:100%;height:100%;cursor:crosshair"}),
    el("canvas",{id:"thumbLoupe",width:180,height:180,style:"position:absolute;right:12px;top:12px;border:1px solid var(--accent);border-radius:8px;background:#000;pointer-events:none"}));
  const side=el("div",{style:"width:240px;border-left:1px solid var(--border);overflow:auto;padding:12px;background:var(--surface)"});
  const ctrl=el("div",{});
  ctrl.append(el("div",{class:"muted-c",style:"font-size:11px;margin-bottom:4px",id:"thumbSliceLbl",text:"Corte"}),
    makeRange("thumbSlice",0,0,0,v=>{THUMB.index=v;loadThumbInstance();}),
    el("div",{class:"muted-c",style:"font-size:11px;margin:8px 0 4px",text:"Zoom da lupa"}),
    makeRange("thumbZoom",2,8,THUMB.zoom,v=>{THUMB.zoom=v;}),
    el("div",{class:"muted-c",style:"font-size:11px;margin:8px 0 4px",text:"Janela (WW / WL)"}),
    makeRange("thumbWW",1,4000,THUMB.ww,v=>{THUMB.ww=v;redrawThumbWindow();}),
    makeRange("thumbWL",-1024,3071,THUMB.wl,v=>{THUMB.wl=v;redrawThumbWindow();}),
    el("div",{style:"display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"},
      ...WINDOW_PRESETS.slice(0,3).map(pr=>el("button",{class:"btn ghost",style:"height:26px;padding:0 8px;font-size:11px",text:pr.name,
        onclick:()=>{THUMB.ww=pr.ww;THUMB.wl=pr.wl;$("#thumbWW").value=pr.ww;$("#thumbWL").value=pr.wl;redrawThumbWindow();}}))));
  side.append(ctrl);
  main.append(left,side); p.append(main);
  sel.onchange=()=>selectThumbSeries(dicomSeries[parseInt(sel.value,10)]);
  selectThumbSeries(dicomSeries[0]);
}
async function selectThumbSeries(s){ THUMB.series=s; THUMB.index=Math.floor(s.instances.length/2);
  const r=$("#thumbSlice"); r.max=s.instances.length-1; r.value=THUMB.index; await loadThumbInstance(); wireThumbLoupe(); }
async function loadThumbInstance(){
  const s=THUMB.series; const f=s.instances[THUMB.index];
  const fr=await frameFor(f,0); if(!fr)return; THUMB.frame=fr;
  const lbl=$("#thumbSliceLbl"); if(lbl) lbl.textContent="Corte "+(THUMB.index+1)+" / "+s.instances.length;
  redrawThumbWindow();
  // dica inicial na lupa (antes do primeiro movimento do cursor)
  const lp=$("#thumbLoupe"); if(lp&&!lp._used){ const c=lp.getContext("2d"); c.clearRect(0,0,180,180);
    c.fillStyle="#6B7C91"; c.font="12px system-ui,sans-serif"; c.textAlign="center";
    c.fillText("Passe o cursor",90,84); c.fillText("sobre a imagem",90,102); }
}
function redrawThumbWindow(){ if(!THUMB.frame)return; THUMB.src=frameToCanvas(THUMB.frame,THUMB.ww,THUMB.wl,false); drawThumb(); }
function drawThumb(){
  const cv=$("#thumbCanvas"); if(!cv||!THUMB.src)return; const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=cv.clientWidth,h=cv.clientHeight; cv.width=w*dpr;cv.height=h*dpr; const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h); const src=THUMB.src; const sc=Math.min(w/src.width,h/src.height)*0.96;
  const dw=src.width*sc, dh=src.height*sc; THUMB._rect={x:(w-dw)/2,y:(h-dh)/2,sc};
  ctx.drawImage(src,(w-dw)/2,(h-dh)/2,dw,dh);
}
function wireThumbLoupe(){ const cv=$("#thumbCanvas"); if(cv._wired)return; cv._wired=true;
  cv.addEventListener("pointermove",e=>{ const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
    const rc=THUMB._rect; if(!rc)return; const ix=(mx-rc.x)/rc.sc, iy=(my-rc.y)/rc.sc; const lp=$("#thumbLoupe"); lp._used=true; const lc=lp.getContext("2d");
    lc.clearRect(0,0,180,180); lc.imageSmoothingEnabled=false; const z=THUMB.zoom; const sw=180/z;
    lc.drawImage(THUMB.src, ix-sw/2, iy-sw/2, sw, sw, 0,0,180,180);
    lc.strokeStyle="rgba(88,215,209,.9)"; lc.beginPath(); lc.moveTo(90,80);lc.lineTo(90,100);lc.moveTo(80,90);lc.lineTo(100,90);lc.stroke();
  });
  if(!THUMB._resizeWired){ THUMB._resizeWired=true;
    window.addEventListener("resize",()=>{ if($("#view-thumb").classList.contains("active")) drawThumb(); }); }
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
// link direto para uma seção: ...#vr, #mpr, #laudo, #arquivos, #exportar...
const HASH_VIEWS={visao:"overview",overview:"overview",visualizador:"viewer",viewer:"viewer",mpr:"mpr",mip:"mip",vr:"vr",volume:"vr",
  mao:"thumb",punho:"thumb",midia:"media",imagens:"media",videos:"media",laudo:"reports",documentos:"reports",arquivos:"archive",
  importar:"import",exportar:"export"};
function openFromHash(){
  const v=HASH_VIEWS[(location.hash||"").slice(1).toLowerCase()]||"overview";
  if(v==="viewer"){ const all=APP.studies.flatMap(st=>st.series), s=all.find(x=>x.isVolume)||all.find(x=>x.kind==="dicom")||all[0];
    if(s){ selectSeries(s); return; } }
  setView(v);
}
async function boot(){
  captureEmbedded();   // antes de qualquer mudança no DOM
  // navegação do rail
  $$("#rail .nav").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
  $("#btnImportTop").onclick=()=>setView("import");
  $("#btnExportTop").onclick=()=>setView("export");
  $("#btnImportEmpty").onclick=()=>setView("import");
  const bs=$("#btnSeries"); if(bs) bs.onclick=()=>$("#sidebar").classList.toggle("open");
  $("#modalClose").onclick=closeModal;
  $("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

  // seletores de arquivo
  $("#fileInput").addEventListener("change",e=>{ const f=Array.from(e.target.files||[]); e.target.value=""; if(f.length) runImportUI(f); });
  $("#folderInput").addEventListener("change",e=>{ const f=Array.from(e.target.files||[]); e.target.value=""; if(f.length) runImportUI(f); });

  // arrastar e soltar em qualquer lugar da janela
  window.addEventListener("dragover",e=>{ e.preventDefault(); });
  window.addEventListener("drop",async e=>{ e.preventDefault(); const files=await entriesFromDataTransfer(e.dataTransfer); if(files.length) runImportUI(files); });

  initViewerInteraction();
  initControls();
  buildToolbar();

  // laudo/documentos escolhidos na página do laudo: entram sem sair da página
  $("#pdfInput").addEventListener("change",async e=>{
    const f=Array.from(e.target.files||[]); e.target.value=""; if(!f.length) return;
    showLoading("Adicionando…",0);
    const rep=await importFiles(f,(d,t)=>showLoading("Adicionando… "+d+" / "+t,d/t));
    hideLoading();
    if(rep){ const msg=rep.imported?(rep.shared?"Documento adicionado ao site.":"Documento adicionado neste dispositivo."):rep.duplicates?"Documento já adicionado.":"Não foi possível adicionar o documento.";
      toast(msg,rep.failed?"warn":"ok",5000); }
    if(currentView()==="reports") renderReports();
  });

  const mm=document.querySelector('meta[name="exam-manifest"]');
  if(mm){   // modo site: exame publicado junto com a página
    REMOTE.on=true; document.body.classList.add("remote");
    showLoading("Carregando exame…",0.3);
    try{ APP.db=await openDB(); }catch(e){ APP.db=null; }
    try{ await loadRemoteExam(mm.getAttribute("content")); }
    catch(e){ console.error(e); toast("Não foi possível carregar o exame.","err",9000); }
    try{ await loadAllFromDB(); }catch(e){ console.error(e); }   // o que foi adicionado neste dispositivo
    hideLoading(); renderSeriesList(); updateTopStatus(); APP.started=true;
    openFromHash(); window.addEventListener("hashchange",openFromHash);
    initShared();   // laudo e documentos guardados no site
    return;
  }
  try{ APP.db=await openDB(); }
  catch(e){ APP.db=null; toast("Armazenamento local indisponível neste navegador/modo. Os dados ficarão só na memória — use o backup .zip.","warn",9000); }
  try{ await loadAllFromDB(); }catch(e){ console.error(e); }
  try{ await loadEmbedded(); }catch(e){ hideLoading(); console.error(e); toast("Falha ao carregar o exame embutido.","err",8000); }
  renderSeriesList();
  updateTopStatus();
  setView(APP.files.length?"overview":"import");
  APP.started=true;
}
document.addEventListener("DOMContentLoaded",boot);
</script>
